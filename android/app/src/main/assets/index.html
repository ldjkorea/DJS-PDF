<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#161513">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="PDF 리더">
<link rel="manifest" href="manifest.json?v=5">
<link rel="icon" type="image/png" href="favicon.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css">
<title>PDF 리더</title>
<style>
  :root{
    --chrome: #161513;
    --canvas-bg: #1f1d1a;
    --bar: rgba(22, 21, 19, 0.92);
    --card-bg: rgba(34, 31, 28, 0.88);
    --accent: #d4a747;
    --accent-dim: #9c7a2f;
    --accent-glow: rgba(212, 167, 71, 0.24);
    --text: #f0ebe1;
    --muted: #948c7e;
    --muted-soft: #6e675c;
    --btn: rgba(255, 255, 255, 0.08);
    --btn-hover: rgba(255, 255, 255, 0.12);
    --btn-active: rgba(212, 167, 71, 0.22);
    --line: rgba(255, 255, 255, 0.08);
    --line-strong: rgba(212, 167, 71, 0.35);
  }
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{height:100%;overflow:hidden}
  body{
    font-family:"Pretendard Variable", Pretendard, -apple-system, BlinkMacSystemFont, system-ui, Roboto, "Noto Sans KR", sans-serif;
    background:var(--chrome);color:var(--text);
    overscroll-behavior:none;
    letter-spacing:-0.015em;
  }

  /* ── 시작 화면 (Welcome) ── */
  #welcome{
    position:fixed;inset:0;z-index:30;
    display:flex;flex-direction:column;align-items:center;justify-content:flex-start;
    text-align:center;padding:calc(env(safe-area-inset-top) + 36px) 20px calc(env(safe-area-inset-bottom) + 24px);
    background:radial-gradient(130% 90% at 50% -10%, #29241e 0%, var(--chrome) 70%);
    overflow-y:auto;-webkit-overflow-scrolling:touch;
  }
  .brand-wrap{
    display:flex;flex-direction:column;align-items:center;margin-bottom:28px;
  }
  .brand-logo{
    width:84px;height:84px;border-radius:22px;margin-bottom:18px;
    box-shadow:0 16px 36px rgba(0,0,0,0.55), 0 0 24px var(--accent-glow);
    border:1px solid rgba(255,255,255,0.12);
    transition:transform .2s ease;
  }
  .brand-logo:hover{transform:scale(1.03)}
  h1{
    font-size:26px;font-weight:700;letter-spacing:-0.02em;margin-bottom:8px;
    background:linear-gradient(180deg,#fff 20%,#e2dac9 100%);
    -webkit-background-clip:text;-webkit-text-fill-color:transparent;
  }
  .sub{color:var(--muted);font-size:14px;line-height:1.55;max-width:320px;margin-bottom:24px}
  .open-main{
    display:inline-flex;align-items:center;gap:10px;
    border:none;cursor:pointer;font-size:15.5px;font-weight:600;color:#181613;
    background:linear-gradient(180deg, #dfb350, #b88d33);
    padding:14px 34px;border-radius:14px;
    box-shadow:0 10px 28px rgba(212,167,71,0.28), inset 0 1px 1px rgba(255,255,255,0.3);
    transition:transform .15s, box-shadow .15s;
  }
  .open-main:active{transform:scale(.96);box-shadow:0 4px 12px rgba(212,167,71,0.2)}
  .drop-hint{
    margin-top:12px;font-size:12.5px;color:var(--muted-soft);
    display:flex;align-items:center;gap:6px;
  }

  /* ── 최근 본 문서 목록 ── */
  .recent{
    margin-top:32px;width:100%;max-width:440px;
  }
  .recent-head{
    display:flex;align-items:center;justify-content:space-between;
    margin-bottom:10px;padding:0 4px;
  }
  .recent-head .rtitle{font-size:12px;font-weight:600;letter-spacing:1px;text-transform:uppercase;color:var(--muted)}
  .recent-head .clear-btn{
    background:none;border:none;color:var(--muted-soft);font-size:11.5px;cursor:pointer;
    padding:2px 6px;border-radius:6px;transition:color .15s;
  }
  .recent-head .clear-btn:hover{color:var(--text)}
  .recent-list{display:flex;flex-direction:column;gap:8px}
  .recent-item{
    display:flex;align-items:center;gap:12px;width:100%;
    background:var(--card-bg);border:1px solid var(--line);border-radius:12px;
    padding:12px 14px;cursor:pointer;color:var(--text);
    text-align:left;transition:background .15s, border-color .15s, transform .1s;
    backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);
  }
  .recent-item:hover{background:rgba(44, 40, 35, 0.95);border-color:rgba(212,167,71,0.25)}
  .recent-item:active{transform:scale(.99)}
  .recent-icon{
    width:32px;height:32px;border-radius:8px;background:rgba(212,167,71,0.12);
    display:flex;align-items:center;justify-content:center;color:var(--accent);flex-shrink:0;
  }
  .recent-info{flex:1;min-width:0}
  .recent-info .ri-name{
    font-size:14px;font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;margin-bottom:2px;
  }
  .recent-info .ri-meta{
    font-size:12px;color:var(--muted);display:flex;align-items:center;gap:8px;font-variant-numeric:tabular-nums;
  }
  .recent-del{
    width:28px;height:28px;border:none;border-radius:8px;background:transparent;
    color:var(--muted-soft);cursor:pointer;display:flex;align-items:center;justify-content:center;
    transition:background .12s, color .12s;flex-shrink:0;
  }
  .recent-del:hover{background:rgba(255,255,255,0.1);color:#ff6b6b}

  /* ── 뷰어 (Viewer) ── */
  #viewer{position:fixed;inset:0;background:var(--canvas-bg);overflow:auto;display:none;-webkit-overflow-scrolling:touch}
  #viewer.on{display:block}
  #stage{min-height:100%;display:flex;align-items:center;justify-content:center;padding:56px 12px 84px}
  #canvasWrap{
    position:relative;transform-origin:center center;will-change:transform;
    transition:transform .04s linear;box-shadow:0 14px 44px rgba(0,0,0,0.6);
    border-radius:3px;overflow:hidden;
  }
  #canvasWrap.flip{transition:transform .22s ease, opacity .22s ease}
  #pdfCanvas{display:block;background:#fff}

  /* ── 텍스트 레이어 (TextLayer - 드래그/선택 지원) ── */
  #textLayer{
    position:absolute;top:0;left:0;right:0;bottom:0;
    overflow:hidden;opacity:0.25;line-height:1.0;
    user-select:text;-webkit-user-select:text;pointer-events:auto;
  }
  #textLayer > span{
    position:absolute;white-space:pre;cursor:text;transform-origin:0% 0%;
  }
  #textLayer ::selection{
    background:rgba(212, 167, 71, 0.45);color:transparent;
  }

  /* ── 본문 읽기 테마 필터 (Reading Filters) ── */
  #canvasWrap.filter-default #pdfCanvas{filter:none;background:#fff}
  #canvasWrap.filter-dark #pdfCanvas{
    filter:invert(0.92) hue-rotate(180deg) contrast(0.95);
    background:#161513;
  }
  #canvasWrap.filter-sepia #pdfCanvas{
    filter:sepia(0.42) contrast(0.96) brightness(0.95);
    background:#f4ecdc;
  }
  #canvasWrap.filter-green #pdfCanvas{
    filter:sepia(0.28) hue-rotate(55deg) brightness(0.97) contrast(0.94);
    background:#e9f0e1;
  }

  /* ── 상단 바 ── */
  #topbar{
    position:fixed;top:0;left:0;right:0;z-index:20;display:flex;align-items:center;gap:6px;
    padding:calc(env(safe-area-inset-top) + 8px) 10px 8px;
    background:linear-gradient(180deg,var(--bar),rgba(22,21,19,0));
    backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);
    transition:transform .25s ease, opacity .25s ease;
  }
  #topbar.hide{transform:translateY(-110%);opacity:0;pointer-events:none}
  .icon-btn{
    width:36px;height:36px;flex-shrink:0;border:none;border-radius:10px;
    background:var(--btn);color:var(--text);cursor:pointer;display:flex;align-items:center;justify-content:center;
    transition:background .15s, transform .1s;border:1px solid var(--line);
  }
  .icon-btn:hover{background:var(--btn-hover)}
  .icon-btn:active{background:var(--btn-active);transform:scale(.94)}
  .icon-btn.active{background:var(--btn-active);color:var(--accent);border-color:var(--line-strong)}
  #fileName{flex:1;font-size:14px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--text);padding:0 4px}

  /* ── 검색 바 (Floating Search Bar) ── */
  .search-bar{
    position:fixed;top:calc(env(safe-area-inset-top) + 54px);left:12px;right:12px;z-index:25;
    background:rgba(26, 24, 21, 0.96);border:1px solid var(--line-strong);border-radius:14px;
    padding:6px 10px;display:flex;align-items:center;gap:8px;
    box-shadow:0 12px 32px rgba(0,0,0,0.65), 0 0 16px var(--accent-glow);
    backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);
    transition:transform .22s ease, opacity .22s ease;
  }
  .search-bar.hide{transform:translateY(-140%);opacity:0;pointer-events:none}
  .sb-input-wrap{flex:1;display:flex;align-items:center;gap:8px;background:rgba(0,0,0,0.28);border-radius:9px;padding:6px 10px;border:1px solid var(--line)}
  .sb-input-wrap svg{color:var(--muted);flex-shrink:0}
  #searchInput{flex:1;background:transparent;border:none;color:var(--text);font-size:14px;outline:none}
  #searchInput::placeholder{color:var(--muted-soft)}
  #searchCount{font-size:11.5px;color:var(--accent);font-weight:600;font-variant-numeric:tabular-nums;white-space:nowrap}
  .sb-btn{width:32px;height:32px;border-radius:8px}

  /* ── 텍스트 검색 하이라이트 ── */
  mark.search-match{
    background:rgba(212, 167, 71, 0.45);color:inherit;border-radius:2px;
  }
  mark.search-match.active{
    background:var(--accent);color:#161513;font-weight:700;box-shadow:0 0 8px rgba(212,167,71,0.8);
  }

  /* ── 하단 페이지 스크러버 슬라이더 ── */
  .scrubber-row{
    position:relative;width:100%;max-width:440px;margin:0 auto 6px;
    display:flex;align-items:center;gap:10px;padding:0 6px;
  }
  .scrub-num{font-size:11px;color:var(--muted);font-variant-numeric:tabular-nums;min-width:20px;text-align:center}
  #pageSlider{
    flex:1;height:5px;-webkit-appearance:none;appearance:none;background:rgba(255,255,255,0.12);
    border-radius:3px;outline:none;cursor:pointer;
  }
  #pageSlider::-webkit-slider-thumb{
    -webkit-appearance:none;appearance:none;width:18px;height:18px;border-radius:50%;
    background:var(--accent);box-shadow:0 0 8px rgba(212,167,71,0.6);border:2px solid #161513;cursor:pointer;
    transition:transform .12s, box-shadow .12s;
  }
  #pageSlider:active::-webkit-slider-thumb{transform:scale(1.2);box-shadow:0 0 14px var(--accent)}
  .scrub-bubble{
    position:absolute;top:-34px;left:50%;transform:translateX(-50%);
    background:rgba(30, 27, 24, 0.96);border:1px solid var(--line-strong);border-radius:14px;
    padding:4px 10px;font-size:12px;font-weight:600;color:var(--accent);
    box-shadow:0 6px 18px rgba(0,0,0,0.6);pointer-events:none;opacity:0;transition:opacity .15s;
    font-variant-numeric:tabular-nums;white-space:nowrap;
  }
  .scrub-bubble.visible{opacity:1}

  /* ── 목차 (TOC) 드로어 ── */
  .drawer-backdrop{
    position:fixed;inset:0;background:rgba(0,0,0,0.6);z-index:40;
    opacity:0;pointer-events:none;transition:opacity .25s ease;
    backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px);
  }
  .drawer-backdrop.open{opacity:1;pointer-events:auto}
  .drawer{
    position:fixed;top:0;left:0;bottom:0;width:min(320px, 84vw);z-index:42;
    background:#1c1a17;border-right:1px solid var(--line);
    display:flex;flex-direction:column;
    transform:translateX(-100%);transition:transform .25s cubic-bezier(0.16, 1, 0.3, 1);
    box-shadow:10px 0 32px rgba(0,0,0,0.5);
  }
  .drawer.open{transform:translateX(0)}
  .drawer-header{
    display:flex;align-items:center;justify-content:space-between;
    padding:calc(env(safe-area-inset-top) + 14px) 16px 14px;
    border-bottom:1px solid var(--line);background:rgba(22,21,19,0.7);
  }
  .drawer-title{display:flex;align-items:center;gap:8px;font-size:15px;font-weight:600;color:var(--text)}
  .drawer-title svg{color:var(--accent)}
  .drawer-body{flex:1;overflow-y:auto;padding:8px 0;-webkit-overflow-scrolling:touch}
  .toc-item{
    display:flex;align-items:center;justify-content:space-between;
    padding:11px 16px;cursor:pointer;color:var(--text);font-size:13.5px;
    border-bottom:1px solid rgba(255,255,255,0.03);transition:background .15s, color .15s;
  }
  .toc-item:hover{background:rgba(255,255,255,0.06);color:var(--accent)}
  .toc-item:active{background:var(--btn-active)}
  .toc-item.level-1{padding-left:28px;font-size:13px;color:var(--muted)}
  .toc-item.level-2{padding-left:42px;font-size:12.5px;color:var(--muted-soft)}
  .toc-text{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex:1}
  .toc-page{font-size:11.5px;color:var(--muted-soft);margin-left:8px;font-variant-numeric:tabular-nums}

  /* ── 목차 드로어 탭 & 설정 푸터 ── */
  .drawer-tabs{display:flex;border-bottom:1px solid var(--line);background:rgba(0,0,0,0.2)}
  .drawer-tab{
    flex:1;padding:12px 8px;border:none;background:transparent;color:var(--muted);
    font-size:13px;font-weight:600;cursor:pointer;border-bottom:2px solid transparent;
    transition:color .15s, border-color .15s;
  }
  .drawer-tab:hover{color:var(--text)}
  .drawer-tab.active{color:var(--accent);border-bottom-color:var(--accent)}
  .drawer-footer{
    padding:12px 16px calc(env(safe-area-inset-bottom) + 12px);
    border-top:1px solid var(--line);background:rgba(22,21,19,0.7);
  }
  .setting-row{display:flex;align-items:center;justify-content:space-between;gap:8px}
  .setting-label{font-size:13px;color:var(--text);font-weight:500}
  .toggle-pill{
    padding:4px 12px;border-radius:14px;border:1px solid var(--line);
    background:var(--btn);color:var(--muted);font-size:11.5px;font-weight:700;
    cursor:pointer;transition:all .15s;
  }
  .toggle-pill.active{background:var(--accent);color:#161513;border-color:var(--accent)}

  /* ── 사용자 책갈피 항목 ── */
  .bookmark-item{
    display:flex;align-items:center;justify-content:space-between;
    padding:12px 16px;cursor:pointer;color:var(--text);font-size:13.5px;
    border-bottom:1px solid rgba(255,255,255,0.03);transition:background .15s;
  }
  .bookmark-item:hover{background:rgba(255,255,255,0.06);color:var(--accent)}
  .bookmark-del{
    width:26px;height:26px;border:none;border-radius:6px;background:transparent;
    color:var(--muted-soft);cursor:pointer;display:flex;align-items:center;justify-content:center;
    transition:color .12s;
  }
  .bookmark-del:hover{color:#ff6b6b}

  /* ── 연속 세로 스크롤 (Continuous Scroll) ── */
  #continuousStage{
    width:100%;min-height:100%;display:flex;flex-direction:column;
    align-items:center;padding:56px 12px 96px;gap:14px;box-sizing:border-box;
  }
  .scroll-page-wrap{
    position:relative;background:#fff;box-shadow:0 12px 36px rgba(0,0,0,0.55);
    border-radius:3px;overflow:hidden;transform-origin:center center;
    transition:transform .05s linear;
  }
  .scroll-page-wrap.filter-default canvas{filter:none;background:#fff}
  .scroll-page-wrap.filter-dark canvas{filter:invert(0.92) hue-rotate(180deg) contrast(0.95);background:#161513}
  .scroll-page-wrap.filter-sepia canvas{filter:sepia(0.42) contrast(0.96) brightness(0.95);background:#f4ecdc}
  .scroll-page-wrap.filter-green canvas{filter:sepia(0.28) hue-rotate(55deg) brightness(0.97) contrast(0.94);background:#e9f0e1}
  .scroll-page-num{
    position:absolute;bottom:6px;right:8px;background:rgba(0,0,0,0.65);
    color:var(--accent);font-size:10px;font-weight:700;padding:2px 6px;
    border-radius:4px;pointer-events:none;z-index:5;font-variant-numeric:tabular-nums;
  }
  .scroll-placeholder{
    display:flex;align-items:center;justify-content:center;
    width:100%;height:100%;background:rgba(255,255,255,0.03);color:var(--muted-soft);
    font-size:13px;
  }
  #bookmarkBtn.active svg{fill:var(--accent);stroke:var(--accent)}
  #viewModeBtn.active{background:var(--btn-active);color:var(--accent);border-color:var(--line-strong)}

  /* ── 최근 본 문서 검색 & 핀 ── */
  .recent-search-row{
    display:flex;align-items:center;gap:8px;background:var(--card-bg);
    border:1px solid var(--line);border-radius:10px;padding:8px 12px;margin-bottom:10px;
  }
  .recent-search-row svg{color:var(--muted-soft);flex-shrink:0}
  #recentSearchInput{flex:1;background:transparent;border:none;outline:none;color:var(--text);font-size:13px}
  #recentSearchInput::placeholder{color:var(--muted-soft)}
  .recent-pin{
    width:28px;height:28px;border:none;border-radius:8px;background:transparent;
    color:var(--muted-soft);cursor:pointer;display:flex;align-items:center;justify-content:center;
    transition:background .12s, color .12s, transform .1s;flex-shrink:0;
  }
  .recent-pin:hover{background:rgba(255,255,255,0.08);color:var(--accent)}
  .recent-pin.pinned{color:var(--accent)}

  /* ── 하단 바 ── */
  #bottombar{
    position:fixed;bottom:0;left:0;right:0;z-index:20;
    background:linear-gradient(0deg,var(--bar),rgba(22,21,19,0));
    backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);
    padding:8px 12px calc(env(safe-area-inset-bottom) + 10px);
    transition:transform .25s ease, opacity .25s ease;
  }
  #bottombar.hide{transform:translateY(110%);opacity:0;pointer-events:none}
  .row{display:flex;align-items:center;justify-content:center;gap:8px}
  .row + .row{margin-top:8px}
  .pagebox{
    display:flex;align-items:center;gap:7px;background:var(--btn);
    border:1px solid var(--line);border-radius:11px;padding:5px 8px;
  }
  #pageInput{
    width:48px;text-align:center;font-size:14.5px;font-weight:600;background:transparent;
    border:none;color:var(--accent);-moz-appearance:textfield;font-variant-numeric:tabular-nums;
  }
  #pageInput::-webkit-outer-spin-button,#pageInput::-webkit-inner-spin-button{-webkit-appearance:none}
  .pagebox .slash{color:var(--muted);font-size:13px}
  #pageTotal{font-size:13.5px;color:var(--muted);min-width:18px;text-align:center;font-variant-numeric:tabular-nums}
  .zoombox{
    display:flex;align-items:center;gap:4px;background:var(--btn);
    border:1px solid var(--line);border-radius:11px;padding:4px;
  }
  .z-btn{
    width:34px;height:32px;border:none;border-radius:8px;background:transparent;
    color:var(--text);font-size:17px;cursor:pointer;display:flex;align-items:center;justify-content:center;
    transition:background .12s;
  }
  .z-btn:hover{background:var(--btn-hover)}
  .z-btn:active{background:var(--btn-active)}
  #zoomPct{font-size:12.5px;color:var(--muted);min-width:44px;text-align:center;font-variant-numeric:tabular-nums;font-weight:500}
  .nav-btn{
    width:46px;height:40px;border:none;border-radius:11px;background:var(--btn);
    border:1px solid var(--line);color:var(--text);cursor:pointer;display:flex;
    align-items:center;justify-content:center;transition:background .12s, transform .1s;
  }
  .nav-btn:hover{background:var(--btn-hover)}
  .nav-btn:active{background:var(--btn-active);transform:scale(.94)}
  .nav-btn:disabled{opacity:.3;pointer-events:none}
  .fit-btn{
    height:40px;padding:0 13px;border:none;border-radius:11px;background:var(--btn);
    border:1px solid var(--line);color:var(--text);font-size:13px;font-weight:500;
    cursor:pointer;display:flex;align-items:center;gap:6px;transition:background .12s;white-space:nowrap;
  }
  .fit-btn:hover{background:var(--btn-hover)}
  .fit-btn:active{background:var(--btn-active)}
  .fit-btn.active{background:var(--btn-active);color:var(--accent);border-color:var(--line-strong)}

  /* ── 드래그 앤 드롭 오버레이 ── */
  #dropOverlay{
    position:fixed;inset:0;z-index:60;display:none;align-items:center;justify-content:center;
    background:rgba(22, 21, 19, 0.88);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);
    border:3px dashed var(--accent);pointer-events:none;
  }

  /* ── 로딩 / 토스트 ── */

  .toast{
    position:fixed;left:50%;bottom:92px;transform:translateX(-50%);

    box-shadow:0 10px 28px rgba(0,0,0,.5);opacity:0;transition:opacity .25s, transform .25s;
    pointer-events:none;font-weight:500;
  }
  .toast.show{opacity:1;transform:translateX(-50%) translateY(-4px)}
  svg{display:block}
</style>

<script>
if (window.pdfjsLib) pdfjsLib.GlobalWorkerOptions.workerSrc = 'pdf.worker.min.js';

/* ── DOM 유틸 ── */
const $ = id => document.getElementById(id);
const welcome=$('welcome'), viewer=$('viewer'), wrap=$('canvasWrap'),
      canvas=$('pdfCanvas'), ctx=canvas.getContext('2d',{alpha:false}),
      textLayer=$('textLayer'),
      topbar=$('topbar'), bottombar=$('bottombar'), loader=$('loader'), loadMsg=$('loadMsg'),
      toastEl=$('toast'), fileInput=$('fileInput'),
      dropOverlay=$('dropOverlay'), pwdModal=$('pwdModal'),
      searchBar=$('searchBar'), searchInput=$('searchInput'), searchCount=$('searchCount'),
      tocDrawer=$('tocDrawer'), tocBackdrop=$('tocBackdrop'), tocList=$('tocList'),
      pageSlider=$('pageSlider'), scrubBubble=$('scrubBubble'), scrubMax=$('scrubMax'),
      continuousStage=$('continuousStage'),
      viewModeBtn=$('viewModeBtn'), bookmarkBtn=$('bookmarkBtn'),
      tabToc=$('tabToc'), tabBookmarks=$('tabBookmarks'), bookmarkList=$('bookmarkList'),
      bookmarkCount=$('bookmarkCount'), volNavToggle=$('volNavToggle'),
      fitBtnText=$('fitBtnText');

/* ── IndexedDB 저장소 (DjsPdfDB_v2) ── */
const DB_NAME = 'DjsPdfDB_v2';
const DB_VERSION = 1;
function openDB(){
  return new Promise((resolve, reject)=>{
    const req = indexedDB.open(DB_NAME, DB_VERSION);
    req.onupgradeneeded = e => {
      const db = e.target.result;
      if (!db.objectStoreNames.contains('meta')) {
        db.createObjectStore('meta', { keyPath: 'key' });
      }
      if (!db.objectStoreNames.contains('files')) {
        db.createObjectStore('files', { keyPath: 'key' });
      }
    };
    req.onsuccess = () => resolve(req.result);
    req.onerror = () => reject(req.error);
  });
}
async function idbSaveFile(key, buffer){
  try{
    const db = await openDB();
    const tx = db.transaction('files', 'readwrite');
    tx.objectStore('files').put({ key, data: buffer });
    return new Promise(res => { tx.oncomplete = () => res(true); tx.onerror = () => res(false); });
  }catch(_){ return false; }
}
async function idbGetFile(key){
  try{
    const db = await openDB();
    const tx = db.transaction('files', 'readonly');
    const req = tx.objectStore('files').get(key);
    return new Promise(res => { req.onsuccess = () => res(req.result ? req.result.data : null); req.onerror = () => res(null); });
  }catch(_){ return null; }
}
async function idbSaveMeta(meta){
  try{
    const db = await openDB();
    const tx = db.transaction('meta', 'readwrite');
    tx.objectStore('meta').put(meta);
    return new Promise(res => { tx.oncomplete = () => res(true); tx.onerror = () => res(false); });
  }catch(_){ return false; }
}
async function idbGetMeta(key){
  try{
    const db = await openDB();
    const tx = db.transaction('meta', 'readonly');
    const req = tx.objectStore('meta').get(key);
    return new Promise(res => { req.onsuccess = () => res(req.result || null); req.onerror = () => res(null); });
  }catch(_){ return null; }
}
async function idbGetAllMeta(){
  try{
    const db = await openDB();
    const tx = db.transaction('meta', 'readonly');
    const req = tx.objectStore('meta').getAll();
    return new Promise(res => {
      req.onsuccess = () => {
        const list = req.result || [];
        list.sort((a,b) => (b.updatedAt||0) - (a.updatedAt||0));
        res(list);
      };
      req.onerror = () => res([]);
    });
  }catch(_){ return []; }
}
async function idbDelete(key){
  try{
    const db = await openDB();
    const tx = db.transaction(['meta','files'], 'readwrite');
    tx.objectStore('meta').delete(key);
    tx.objectStore('files').delete(key);
    return new Promise(res => { tx.oncomplete = () => res(true); tx.onerror = () => res(false); });
  }catch(_){ return false; }
}
async function idbClearAll(){
  try{
    const db = await openDB();
    const tx = db.transaction(['meta','files'], 'readwrite');
    tx.objectStore('meta').clear();
    tx.objectStore('files').clear();
    return new Promise(res => { tx.oncomplete = () => res(true); tx.onerror = () => res(false); });
  }catch(_){ return false; }
}

/* ── 문서 공유 (Native Intent & Web Share) ── */
async function shareCurrentDoc(){
  if(!pdfDoc) return;
  showLoader('공유 준비 중…');
  try{
    if(window.AndroidBridge && window.AndroidBridge.shareCurrentPdf){
      if(window.AndroidBridge.isCurrentPdfReady && !window.AndroidBridge.isCurrentPdfReady(curName)){
        const buf = await idbGetFile(docKey);
        if(buf && buf.byteLength < 35 * 1024 * 1024){
          let binary = '';
          const bytes = new Uint8Array(buf);
          const len = bytes.byteLength;
          for(let i=0; i<len; i+=8192){
            binary += String.fromCharCode.apply(null, bytes.subarray(i, Math.min(i + 8192, len)));
          }
          if(window.AndroidBridge.saveCurrentPdfBase64){
            window.AndroidBridge.saveCurrentPdfBase64(btoa(binary), curName);
          }
        }
      }
      hideLoader();
      window.AndroidBridge.shareCurrentPdf(curName);
      return;
    }
    if(navigator.share){
      const buf = await idbGetFile(docKey);
      if(buf){
        const file = new File([buf], curName, { type: 'application/pdf' });
        hideLoader();
        await navigator.share({ files: [file], title: curName });
        return;
      }
    }
    hideLoader();
    toast('현재 환경에서는 파일 공유를 지원하지 않습니다');
  }catch(err){
    hideLoader();
    if(err.name !== 'AbortError') toast('공유 실패: ' + err.message);
  }
}

async function navigateToDest(dest){
  try{
    let explicitDest = dest;
    if(typeof dest === 'string'){
      explicitDest = await pdfDoc.getDestination(dest);
    }
    if(Array.isArray(explicitDest)){
      const destRef = explicitDest[0];
      const pageIndex = await pdfDoc.getPageIndex(destRef);
      closeTocDrawer();
      gotoPage(pageIndex + 1);
    }
  }catch(err){
    console.warn('TOC dest navigation failed:', err);
  }

function buildTocTree(items, level){
  level = level || 0;
  if(level === 0) tocList.innerHTML = '';
  if(!items || !items.length){
    if(level === 0){
      tocList.innerHTML = '<div style="padding:24px;text-align:center;color:var(--muted);font-size:13px">목차가 없는 문서입니다.<br><span style="font-size:12px;color:var(--muted-soft)">상단 책갈피 탭에서 원하는 페이지를 저장할 수 있습니다.</span></div>';
    }
    return;
  }
  items.forEach(item => {
    const el = document.createElement('div');
    el.className = 'toc-item' + (level > 0 ? ' level-' + Math.min(level, 2) : '');
    const titleText = (item.title || '').trim();
    el.innerHTML = `<span class="toc-text">${escapeHtml(titleText)}</span>`;
    if(item.dest){
      el.onclick = () => navigateToDest(item.dest);
    }
    tocList.appendChild(el);
    if(item.items && item.items.length){
      buildTocTree(item.items, level + 1);
    }
  });
}

/* ── 본문 검색 & 실시간 하이라이트 ── */
let searchQuery = '';
let searchMatches = [];
let curSearchMatchIdx = -1;
const pageTextCache = new Map();
let searchDebounceTimer = null;

function toggleSearchBar(force){
  const isHidden = searchBar.classList.contains('hide');
  const shouldShow = force !== undefined ? force : isHidden;
  searchBar.classList.toggle('hide', !shouldShow);
  $('searchBtn').classList.toggle('active', shouldShow);
  if(shouldShow){
    setTimeout(()=>{ searchInput.focus(); searchInput.select(); }, 120);
  } else {
    clearSearchHighlights();
  }
}
$('searchBtn').onclick = () => toggleSearchBar();
$('searchCloseBtn').onclick = () => toggleSearchBar(false);

function clearSearchHighlights(){
  searchQuery = '';
  searchMatches = [];
  curSearchMatchIdx = -1;
  searchCount.textContent = '0 / 0';
  const marks = textLayer.querySelectorAll('mark.search-match');
  marks.forEach(m => {
    const parent = m.parentNode;
    if(parent){
      parent.replaceChild(document.createTextNode(m.textContent), m);
      parent.normalize();
    }
  });
}

async function getPageText(num){
  if(pageTextCache.has(num)) return pageTextCache.get(num);
  const page = await pdfDoc.getPage(num);
  const tc = await page.getTextContent();
  const fullText = tc.items.map(it => it.str).join(' ');
  const res = { tc, fullText };
  pageTextCache.set(num, res);
  return res;
}

async function performSearch(query){
  query = (query || '').trim();
  if(!query || !pdfDoc){
    clearSearchHighlights();
    return;
  }
  searchQuery = query;
  searchMatches = [];
  curSearchMatchIdx = -1;
  searchCount.textContent = '검색 중…';

  const lowerQuery = query.toLowerCase();
  for(let i = 1; i <= totalPages; i++){
    const { fullText } = await getPageText(i);
    let idx = fullText.toLowerCase().indexOf(lowerQuery);
    let pageMatchIdx = 0;
    while(idx !== -1){
      searchMatches.push({ pageNum: i, matchIndex: pageMatchIdx++ });
      idx = fullText.toLowerCase().indexOf(lowerQuery, idx + lowerQuery.length);
    }
  }

  if(!searchMatches.length){
    searchCount.textContent = '0 / 0';
    toast('일치하는 결과가 없습니다');
    return;
  }

  let targetIdx = searchMatches.findIndex(m => m.pageNum >= pageNum);
  if(targetIdx === -1) targetIdx = 0;
  goToMatch(targetIdx);
}

function goToMatch(index){
  if(!searchMatches.length) return;
  curSearchMatchIdx = (index + searchMatches.length) % searchMatches.length;
  const match = searchMatches[curSearchMatchIdx];
  searchCount.textContent = `${curSearchMatchIdx + 1} / ${searchMatches.length}`;

  if(viewMode === 'continuous'){
    gotoPage(match.pageNum);
    setTimeout(() => {
      const wrapEl = document.getElementById('pageWrap_' + match.pageNum);
      const activeMark = wrapEl ? wrapEl.querySelector('mark.search-match.active') : null;
      if(activeMark) activeMark.scrollIntoView({ behavior: 'smooth', block: 'center' });
    }, 280);
    return;
  }

  if(match.pageNum === pageNum){
    highlightTextLayer();
  } else {
    gotoPage(match.pageNum);
  }
}

$('searchNextBtn').onclick = () => {
  if(searchMatches.length) goToMatch(curSearchMatchIdx + 1);
};
$('searchPrevBtn').onclick = () => {
  if(searchMatches.length) goToMatch(curSearchMatchIdx - 1);
};

searchInput.addEventListener('input', e => {
  clearTimeout(searchDebounceTimer);
  const val = e.target.value;
  searchDebounceTimer = setTimeout(() => performSearch(val), 280);
});
searchInput.addEventListener('keydown', e => {
  if(e.key === 'Enter'){
    e.preventDefault();
    if(e.shiftKey){
      $('searchPrevBtn').click();
    } else {
      $('searchNextBtn').click();
    }
  } else if(e.key === 'Escape'){
    toggleSearchBar(false);
  }
});

function highlightTextLayer(){
  if(!searchQuery || !textLayer) return;
  const spans = textLayer.querySelectorAll('span');
  const lowerQ = searchQuery.toLowerCase();
  const qLen = searchQuery.length;

  spans.forEach(span => {
    const text = span.textContent;
    const lowerText = text.toLowerCase();
    if(!lowerText.includes(lowerQ)) return;

    let html = '';
    let lastIdx = 0;
    let idx = lowerText.indexOf(lowerQ);
    while(idx !== -1){
      html += escapeHtml(text.slice(lastIdx, idx));
      html += `<mark class="search-match">${escapeHtml(text.slice(idx, idx + qLen))}</mark>`;
      lastIdx = idx + qLen;
      idx = lowerText.indexOf(lowerQ, lastIdx);
    }
    html += escapeHtml(text.slice(lastIdx));
    span.innerHTML = html;
  });

  const allMarks = textLayer.querySelectorAll('mark.search-match');
  if(allMarks.length > 0){
    const curMatch = searchMatches[curSearchMatchIdx];
    if(curMatch && curMatch.pageNum === pageNum){
      const activeMark = allMarks[curMatch.matchIndex] || allMarks[0];
      if(activeMark){
        activeMark.classList.add('active');
        activeMark.scrollIntoView({ behavior: 'smooth', block: 'center', inline: 'center' });
      }
    }
  }
}

/* ── 문서 로드 및 초기화 ── */
async function loadDoc(data, initialPage, initialRotation, initialFilter){
  try{
    if(!window.pdfjsLib){ hideLoader(); toast('PDF 엔진 로드 실패'); return; }
    
    const loadingTask = pdfjsLib.getDocument({
      data,
      onPassword: (cb, reason) => handlePassword(cb, reason)
    });
    
    pdfDoc = await loadingTask.promise;
    totalPages = pdfDoc.numPages;
    pageNum = initialPage || 1;
    curRotation = initialRotation || 0;
    
    const filterClass = initialFilter || 'filter-default';
    curFilterIndex = FILTERS.indexOf(filterClass);
    if (curFilterIndex === -1) curFilterIndex = 0;
    applyFilterClass(FILTERS[curFilterIndex], false);
    
    zoom = 1;
    $('pageTotal').textContent = totalPages;
    $('pageInput').max = totalPages;
    pageSlider.max = totalPages;
    scrubMax.textContent = totalPages;
    $('fileName').textContent = curName.replace(/\.pdf$/i,'');
    
    welcome.style.display = 'none';
    viewer.classList.add('on');
    topbar.classList.remove('hide');
    bottombar.classList.remove('hide');
    
    // Reset search & text cache
    pageTextCache.clear();
    clearSearchHighlights();
    toggleSearchBar(false);

    // Screen Stay-Awake & Native state
    requestWakeLock();
    if (window.AndroidBridge && window.AndroidBridge.setViewerActive) {
      window.AndroidBridge.setViewerActive(true);
    }

    // Load Document Outline (TOC)
    $('tocBtn').style.display = 'inline-flex';
    try {
      const outline = await pdfDoc.getOutline();
      buildTocTree(outline);
    } catch (_) {
      buildTocTree(null);
    }

    // Load Bookmarks from DB meta
    try {
      const meta = await idbGetMeta(docKey);
      curBookmarks = (meta && Array.isArray(meta.bookmarks)) ? meta.bookmarks : [];
    } catch (_) { curBookmarks = []; }
    updateBookmarkButton();
    renderBookmarksList();

    await saveCurrentMeta();
    
    updateViewModeUI();
    if(viewMode === 'continuous'){
      $('stage').style.display = 'none';
      continuousStage.style.display = 'flex';
      await initContinuousStage();
      setTimeout(() => {
        const target = document.getElementById('pageWrap_' + pageNum);
        if(target) target.scrollIntoView({ behavior: 'auto', block: 'start' });
      }, 80);
    } else {
      continuousStage.style.display = 'none';
      $('stage').style.display = 'flex';
      await renderPage(pageNum, true);
    }
    hideLoader();
    if(pageNum > 1) toast(pageNum + '페이지부터 이어보기');
  }catch(err){
    console.error(err);
    hideLoader();
    if (err && err.name === 'PasswordException') return;
    toast('열 수 없거나 손상된 PDF입니다');
  }
}

/* ── 페이지 렌더링 (Canvas + TextLayer) ── */
async function renderPage(n, resetScroll){
  if(!pdfDoc) return;
  if(rendering){ pendingPage={n,resetScroll}; return; }
  rendering=true;
  try{
    const page = await pdfDoc.getPage(n);
    const unscaled = page.getViewport({ scale: 1, rotation: curRotation });
    const vw = Math.max(280, viewer.clientWidth - 20);
    baseScale = vw / unscaled.width;
    const eff = baseScale * zoom;
    
    curViewport = page.getViewport({ scale: eff * DPR, rotation: curRotation });
    canvas.width = Math.floor(curViewport.width);
    canvas.height = Math.floor(curViewport.height);
    canvas.style.width = Math.floor(curViewport.width / DPR) + 'px';
    canvas.style.height = Math.floor(curViewport.height / DPR) + 'px';
    
    wrap.style.transform = '';
    await page.render({ canvasContext: ctx, viewport: curViewport }).promise;
    
    /* 텍스트 레이어 렌더링 (텍스트 드래그 및 복사 지원) */
    if (window.pdfjsLib && pdfjsLib.renderTextLayer) {
      try {
        const textContent = await page.getTextContent();
        textLayer.innerHTML = '';
        textLayer.style.width = canvas.style.width;
        textLayer.style.height = canvas.style.height;
        textLayer.style.setProperty('--scale-factor', eff);
        const textViewport = page.getViewport({ scale: eff, rotation: curRotation });
        await pdfjsLib.renderTextLayer({
          textContentSource: textContent,
          container: textLayer,
          viewport: textViewport,
          textDivs: []
        }).promise;

        // 본문 검색어 하이라이트 적용
        highlightTextLayer();
      } catch (tErr) { console.warn('TextLayer render error:', tErr); }
    }
    
    pageNum = n;
    window.pageNum = n;
    window.totalPages = totalPages;
    $('pageInput').value = n;
    pageSlider.value = n;
    pageSlider.max = totalPages;
    scrubMax.textContent = totalPages;
    $('prevBtn').disabled = (n <= 1);
    $('nextBtn').disabled = (n >= totalPages);
    updateZoomLabel();
    updateBookmarkButton();
    
    if(resetScroll){
      viewer.scrollTop = 0;
      viewer.scrollLeft = Math.max(0, (canvas.offsetWidth - viewer.clientWidth) / 2);
    }
    
    /* 최근 메타데이터 비동기 갱신 */
    saveCurrentMeta();
  }catch(err){ console.error(err); }
  rendering=false;
  if(pendingPage){ const p=pendingPage; pendingPage=null; renderPage(p.n, p.resetScroll); }
}

/* ── 연속 세로 스크롤 엔진 (Continuous Scroll Engine) ── */
async function initContinuousStage(){
  if(!pdfDoc) return;
  isContinuousInitializing = true;
  if(continuousObserver){ continuousObserver.disconnect(); continuousObserver = null; }
  renderedPagesMap.clear();
  continuousStage.innerHTML = '';

  let aspect = 1.414;
  try{
    const p1 = await pdfDoc.getPage(1);
    const vp1 = p1.getViewport({ scale: 1, rotation: curRotation });
    aspect = vp1.height / vp1.width;
  }catch(_){}

  const maxW = Math.max(280, Math.min(viewer.clientWidth - 20, 840) * zoom);
  const minH = Math.floor(maxW * aspect);

  const frag = document.createDocumentFragment();
  for(let i = 1; i <= totalPages; i++){
    const wrapEl = document.createElement('div');
    wrapEl.className = 'scroll-page-wrap ' + FILTERS[curFilterIndex];
    wrapEl.id = 'pageWrap_' + i;
    wrapEl.dataset.page = i;
    wrapEl.style.width = Math.floor(maxW) + 'px';
    wrapEl.style.minHeight = minH + 'px';
    wrapEl.innerHTML = `
      <div class="scroll-placeholder" id="placeholder_${i}">
        <span>${i} / ${totalPages} 쪽 불러오는 중…</span>
      </div>
      <canvas class="scroll-canvas" id="scrollCanvas_${i}" style="display:none;"></canvas>
      <div class="textLayer" id="scrollTextLayer_${i}" style="display:none;"></div>
      <div class="scroll-page-num">${i} 쪽</div>
    `;
    frag.appendChild(wrapEl);
  }
  continuousStage.appendChild(frag);

  continuousObserver = new IntersectionObserver((entries) => {
    entries.forEach(entry => {
      const p = parseInt(entry.target.dataset.page);
      if(entry.isIntersecting){
        renderContinuousPage(p);
      } else {
        unmountContinuousPage(p);
      }
    });
  }, {
    root: viewer,
    rootMargin: '500px 0px 500px 0px'
  });

  document.querySelectorAll('.scroll-page-wrap').forEach(el => continuousObserver.observe(el));
  isContinuousInitializing = false;
}

async function renderContinuousPage(p){
  if(!pdfDoc || renderedPagesMap.has(p)) return;
  renderedPagesMap.set(p, { rendering: true });
  try{
    const page = await pdfDoc.getPage(p);
    const unscaled = page.getViewport({ scale: 1, rotation: curRotation });
    const wrapEl = document.getElementById('pageWrap_' + p);
    if(!wrapEl) return;
    const targetW = wrapEl.clientWidth || Math.max(280, viewer.clientWidth - 20);
    const eff = targetW / unscaled.width;
    const vp = page.getViewport({ scale: eff * DPR, rotation: curRotation });

    const cvs = document.getElementById('scrollCanvas_' + p);
    const txtL = document.getElementById('scrollTextLayer_' + p);
    const ph = document.getElementById('placeholder_' + p);
    if(!cvs || !txtL) return;

    cvs.width = Math.floor(vp.width);
    cvs.height = Math.floor(vp.height);
    cvs.style.width = targetW + 'px';
    cvs.style.height = Math.floor(vp.height / DPR) + 'px';
    wrapEl.style.minHeight = cvs.style.height;
    cvs.style.display = 'block';
    if(ph) ph.style.display = 'none';

    const ctxP = cvs.getContext('2d', { alpha: false });
    await page.render({ canvasContext: ctxP, viewport: vp }).promise;

    if(window.pdfjsLib && pdfjsLib.renderTextLayer){
      try{
        const textContent = await page.getTextContent();
        txtL.innerHTML = '';
        txtL.style.width = cvs.style.width;
        txtL.style.height = cvs.style.height;
        txtL.style.setProperty('--scale-factor', eff);
        txtL.style.display = 'block';
        const textVp = page.getViewport({ scale: eff, rotation: curRotation });
        await pdfjsLib.renderTextLayer({
          textContentSource: textContent,
          container: txtL,
          viewport: textVp,
          textDivs: []
        }).promise;
        
        highlightContinuousPage(p, txtL);
      }catch(_){}
    }
    renderedPagesMap.set(p, { rendering: false, loaded: true });
  }catch(err){
    renderedPagesMap.delete(p);
  }
}

function unmountContinuousPage(p){
  const data = renderedPagesMap.get(p);
  if(!data || data.rendering) return;
  const cvs = document.getElementById('scrollCanvas_' + p);
  const txtL = document.getElementById('scrollTextLayer_' + p);
  const ph = document.getElementById('placeholder_' + p);
  if(cvs){
    cvs.width = 1; cvs.height = 1;
    cvs.style.display = 'none';
  }
  if(txtL){
    txtL.innerHTML = '';
    txtL.style.display = 'none';
  }
  if(ph) ph.style.display = 'flex';
  renderedPagesMap.delete(p);
}

function highlightContinuousPage(p, txtContainer){
  if(!searchQuery || !txtContainer) return;
  const spans = txtContainer.querySelectorAll('span');
  const lowerQ = searchQuery.toLowerCase();
  spans.forEach(span => {
    const text = span.textContent;
    const lowerText = text.toLowerCase();
    if(!lowerText.includes(lowerQ)) return;
    let html = '';
    let start = 0;
    let idx = lowerText.indexOf(lowerQ, start);
    while(idx !== -1){
      html += escapeHtml(text.substring(start, idx));
      html += '<mark class="search-match">' + escapeHtml(text.substring(idx, idx + searchQuery.length)) + '</mark>';
      start = idx + searchQuery.length;
      idx = lowerText.indexOf(lowerQ, start);
    }
    html += escapeHtml(text.substring(start));
    span.innerHTML = html;
  });

  const curMatch = searchMatches[curSearchMatchIdx];
  if(curMatch && curMatch.pageNum === p){
    const allMarks = txtContainer.querySelectorAll('mark.search-match');
    const activeMark = allMarks[curMatch.matchIndex] || allMarks[0];
    if(activeMark){
      activeMark.classList.add('active');
    }
  }
}

// Track active page during continuous scroll
let scrollThrottleTimer = null;
viewer.addEventListener('scroll', () => {
  if(viewMode !== 'continuous' || !pdfDoc || isContinuousInitializing) return;
  if(scrollThrottleTimer) return;
  scrollThrottleTimer = setTimeout(() => {
    scrollThrottleTimer = null;
    updateContinuousActivePage();
  }, 90);
}, { passive: true });

function updateContinuousActivePage(){
  const wraps = continuousStage.querySelectorAll('.scroll-page-wrap');
  if(!wraps.length) return;
  const viewerCenter = viewer.scrollTop + viewer.clientHeight / 2;
  let closestP = pageNum;
  let minDiff = Infinity;
  wraps.forEach(w => {
    const top = w.offsetTop;
    const mid = top + (w.offsetHeight / 2);
    const diff = Math.abs(viewerCenter - mid);
    if(diff < minDiff){
      minDiff = diff;
      closestP = parseInt(w.dataset.page);
    }
  });

  if(closestP !== pageNum){
    pageNum = closestP;
    window.pageNum = closestP;
    $('pageInput').value = closestP;
    pageSlider.value = closestP;
    $('prevBtn').disabled = (closestP <= 1);
    $('nextBtn').disabled = (closestP >= totalPages);
    updateBookmarkButton();
    saveCurrentMeta();
  }
}

function updateViewModeUI(){
  if(viewMode === 'continuous'){
    viewModeBtn.classList.add('active');
    viewModeBtn.title = '연속 스크롤 켜짐 (터치 시 단면 보기로 전환)';
  } else {
    viewModeBtn.classList.remove('active');
    viewModeBtn.title = '단면 보기 켜짐 (터치 시 연속 스크롤로 전환)';
  }
}

function setViewMode(mode){
  viewMode = mode;
  localStorage.setItem('djs_view_mode', mode);
  updateViewModeUI();
  if(mode === 'continuous'){
    $('stage').style.display = 'none';
    continuousStage.style.display = 'flex';
    initContinuousStage().then(() => {
      setTimeout(() => {
        const target = document.getElementById('pageWrap_' + pageNum);
        if(target) target.scrollIntoView({ behavior: 'auto', block: 'start' });
      }, 50);
    });
    toast('연속 세로 스크롤 모드');
  } else {
    continuousStage.style.display = 'none';
    $('stage').style.display = 'flex';
    if(continuousObserver){ continuousObserver.disconnect(); continuousObserver = null; }
    renderedPagesMap.clear();
    continuousStage.innerHTML = '';
    renderPage(pageNum, true);
    toast('단면 넘김 모드');
  }
}

if(viewModeBtn){
  viewModeBtn.onclick = () => {
    setViewMode(viewMode === 'continuous' ? 'single' : 'continuous');
  };
}

function gotoPage(n){
  n = Math.max(1, Math.min(totalPages, n|0));
  if(n === pageNum && viewMode !== 'continuous') return;
  const oldPage = pageNum;
  pageNum = n;
  window.pageNum = n;
  $('pageInput').value = n;
  pageSlider.value = n;
  $('prevBtn').disabled = (n <= 1);
  $('nextBtn').disabled = (n >= totalPages);
  updateBookmarkButton();

  if(viewMode === 'continuous'){
    const target = document.getElementById('pageWrap_' + n);
    if(target){
      target.scrollIntoView({ behavior: 'smooth', block: 'start' });
    }
    saveCurrentMeta();
    return;
  }
  zoom = 1;
  animateFlip(n > oldPage ? 1 : -1);
  renderPage(n, true);
}
window.gotoPage = gotoPage;

function animateFlip(dir){
  wrap.classList.add('flip');
  wrap.style.opacity = '0';
  wrap.style.transform = 'translateX(' + (dir * 24) + 'px)';
  setTimeout(()=>{ wrap.style.opacity='1'; wrap.style.transform=''; setTimeout(()=>wrap.classList.remove('flip'),220); },90);
}

/* ── 버튼 이벤트 ── */
$('prevBtn').onclick = () => gotoPage(pageNum - 1);
$('nextBtn').onclick = () => gotoPage(pageNum + 1);
$('homeBtn').onclick = goHome;
$('pageInput').addEventListener('change', e => gotoPage(parseInt(e.target.value) || 1));
$('pageInput').addEventListener('focus', e => e.target.select());

function goHome(){
  viewer.classList.remove('on');
  topbar.classList.add('hide');
  bottombar.classList.add('hide');
  welcome.style.display = 'flex';
  toggleSearchBar(false);
  closeTocDrawer();
  releaseWakeLock();
  if (continuousObserver) { continuousObserver.disconnect(); continuousObserver = null; }
  renderedPagesMap.clear();
  continuousStage.innerHTML = '';
  if (window.AndroidBridge && window.AndroidBridge.setViewerActive) {
    window.AndroidBridge.setViewerActive(false);
  }
  renderRecent();
}

/* ── 테마 필터 (Dark / Sepia / Eye-Care Green) ── */
function applyFilterClass(cls, showToastNotify){
  FILTERS.forEach(f => {
    wrap.classList.remove(f);
    if(continuousStage){
      const items = continuousStage.querySelectorAll('.scroll-page-wrap');
      items.forEach(el => el.classList.remove(f));
    }
  });
  wrap.classList.add(cls);
  if(continuousStage){
    const items = continuousStage.querySelectorAll('.scroll-page-wrap');
    items.forEach(el => el.classList.add(cls));
  }
  $('filterBtn').classList.toggle('active', cls !== 'filter-default');
  if (showToastNotify) toast(FILTER_NAMES[cls]);
}

$('filterBtn').onclick = () => {
  curFilterIndex = (curFilterIndex + 1) % FILTERS.length;
  const newFilter = FILTERS[curFilterIndex];
  applyFilterClass(newFilter, true);
  saveCurrentMeta();
};

/* ── 회전 (Rotation) ── */
$('rotateBtn').onclick = () => {
  curRotation = (curRotation + 90) % 360;
  toast(curRotation + '° 회전');
  if(viewMode === 'continuous'){
    initContinuousStage();
  } else {
    renderPage(pageNum, false);
  }
};

/* ── 줌 & 맞춤 제어 ── */
function applyZoom(z){
  z = Math.max(MIN_ZOOM, Math.min(MAX_ZOOM, z));
  if(Math.abs(z - zoom) < 0.001) return;
  const ratio = z / zoom;
  const cx = viewer.scrollLeft + viewer.clientWidth / 2;
  const cy = viewer.scrollTop + viewer.clientHeight / 2;
  zoom = z;
  if(viewMode === 'continuous'){
    const maxW = Math.max(280, Math.min(viewer.clientWidth - 20, 840) * zoom);
    document.querySelectorAll('.scroll-page-wrap').forEach(el => el.style.width = Math.floor(maxW) + 'px');
    renderedPagesMap.clear();
    document.querySelectorAll('.scroll-page-wrap').forEach(el => {
      if(continuousObserver) continuousObserver.unobserve(el);
      if(continuousObserver) continuousObserver.observe(el);
    });
  } else {
    renderPage(pageNum, false).then(()=>{
      viewer.scrollLeft = cx * ratio - viewer.clientWidth / 2;
      viewer.scrollTop  = cy * ratio - viewer.clientHeight / 2;
    });
  }
  updateZoomLabel();
}

function updateZoomLabel(){
  $('zoomPct').textContent = Math.round(zoom * 100) + '%';
  $('fitBtn').classList.toggle('active', Math.abs(zoom - 1) < 0.02 && fitMode === 'width');
}

$('zoomIn').onclick = () => applyZoom(zoom + 0.25);
$('zoomOut').onclick = () => applyZoom(zoom - 0.25);

$('fitBtn').onclick = () => {
  if(fitMode === 'width'){
    fitMode = 'page';
    if(fitBtnText) fitBtnText.textContent = '전체 맞춤';
    if(viewMode === 'continuous'){
      setViewMode('single');
    }
    renderFitPage();
    toast('전체 페이지 맞춤');
  } else {
    fitMode = 'width';
    if(fitBtnText) fitBtnText.textContent = '너비 맞춤';
    zoom = 1;
    if(viewMode === 'continuous'){
      initContinuousStage();
    } else {
      renderPage(pageNum, true);
    }
    toast('너비 맞춤');
  }
};

async function renderFitPage(){
  if(!pdfDoc) return;
  const page = await pdfDoc.getPage(pageNum);
  const unscaled = page.getViewport({ scale: 1, rotation: curRotation });
  const vw = Math.max(280, viewer.clientWidth - 20);
  const vh = Math.max(300, viewer.clientHeight - 140);
  const scale = Math.min(vw / unscaled.width, vh / unscaled.height);
  zoom = scale / baseScale;
  renderPage(pageNum, true);
}

/* ── 터치 제스처 (Pinch 줌, 스와이프, 더블탭) ── */
let touchStartX=0, touchStartY=0, touchStartT=0, lastTap=0, moved=false;
let pinch=false, pinchStartDist=0, pinchStartZoom=1, twoFinger=false;
function dist(t){ return Math.hypot(t[0].clientX - t[1].clientX, t[0].clientY - t[1].clientY); }

viewer.addEventListener('touchstart', e => {
  if(e.touches.length === 2){
    pinch = true; twoFinger = true;
    pinchStartDist = dist(e.touches);
    pinchStartZoom = zoom;
    wrap.classList.remove('flip');
  } else if(e.touches.length === 1){
    touchStartX = e.touches[0].clientX;
    touchStartY = e.touches[0].clientY;
    touchStartT = Date.now();
    moved = false;
  }
},{passive:true});

viewer.addEventListener('touchmove', e => {
  if(pinch && e.touches.length === 2){
    const live = pinchStartZoom * (dist(e.touches) / pinchStartDist);
    const clamped = Math.max(MIN_ZOOM, Math.min(MAX_ZOOM, live));
    wrap.style.transform = 'scale(' + (clamped / zoom) + ')';
  } else if(e.touches.length === 1){
    if(Math.abs(e.touches[0].clientX - touchStartX) > 8 || Math.abs(e.touches[0].clientY - touchStartY) > 8) moved = true;
  }
},{passive:true});

viewer.addEventListener('touchend', e => {
  if(pinch && e.touches.length < 2){
    pinch = false;
    const m = wrap.style.transform.match(/scale\(([\d.]+)\)/);
    if(m) applyZoom(zoom * parseFloat(m[1]));
    setTimeout(()=>{ twoFinger = false; }, 150);
    return;
  }
  if(twoFinger) return;
  const dx = e.changedTouches[0].clientX - touchStartX;
  const dy = e.changedTouches[0].clientY - touchStartY;
  const dt = Date.now() - touchStartT;
  if(zoom <= 1.02 && Math.abs(dx) > 60 && Math.abs(dx) > Math.abs(dy) * 1.6 && dt < 600){
    if(dx < 0) gotoPage(pageNum + 1); else gotoPage(pageNum - 1);
    return;
  }
  if(!moved && dt < 260){
    const now = Date.now();
    if(now - lastTap < 300){
      lastTap = 0;
      if(zoom > 1.02){ zoom = 1; renderPage(pageNum, true); }
      else applyZoom(2.2);
    } else {
      lastTap = now;
      setTimeout(()=>{ if(Date.now() - lastTap >= 300) toggleChrome(); }, 300);
    }
  }
},{passive:true});

function toggleChrome(){
  const hidden = topbar.classList.contains('hide');
  topbar.classList.toggle('hide', !hidden);
  bottombar.classList.toggle('hide', !hidden);
}

/* ── 드래그 앤 드롭 지원 ── */
window.addEventListener('dragover', e => {
  e.preventDefault();
  dropOverlay.classList.add('active');
});
window.addEventListener('dragleave', e => {
  if (e.relatedTarget === null) dropOverlay.classList.remove('active');
});
window.addEventListener('drop', e => {
  e.preventDefault();
  dropOverlay.classList.remove('active');
  const f = e.dataTransfer && e.dataTransfer.files && e.dataTransfer.files[0];
  if(f) openFile(f);
});

/* ── 키보드 단축키 ── */
document.addEventListener('keydown', e => {
  if(!viewer.classList.contains('on')) return;
  if(e.target === $('pageInput') || e.target === $('pwdInput') || e.target === searchInput) return;
  if((e.ctrlKey || e.metaKey) && (e.key === 'f' || e.key === 'F')){
    e.preventDefault();
    toggleSearchBar();
    return;
  }
  if(e.key === 'ArrowRight' || e.key === 'ArrowDown' || e.key === 'PageDown' || e.key === ' '){
    e.preventDefault(); gotoPage(pageNum + 1);
  } else if(e.key === 'ArrowLeft' || e.key === 'ArrowUp' || e.key === 'PageUp'){
    e.preventDefault(); gotoPage(pageNum - 1);
  } else if(e.key === '+' || e.key === '='){
    applyZoom(zoom + 0.25);
  } else if(e.key === '-'){
    applyZoom(zoom - 0.25);
  } else if(e.key === 'r' || e.key === 'R'){
    $('rotateBtn').click();
  } else if(e.key === 't' || e.key === 'T'){
    $('filterBtn').click();
  } else if(e.key === 'Escape'){
    if(!searchBar.classList.contains('hide')){
      toggleSearchBar(false);
    } else if(tocDrawer.classList.contains('open')){
      closeTocDrawer();
    } else {
      goHome();
    }
  }
});

viewer.addEventListener('wheel', e => {
  if(e.ctrlKey){ e.preventDefault(); applyZoom(zoom + (e.deltaY < 0 ? 0.15 : -0.15)); }
},{passive:false});

/* ── 최근 본 문서 렌더링 (IndexedDB 기반 즉시 열기, 검색 필터, 상단 고정) ── */
async function renderRecent(filterText = ''){
  const list = await idbGetAllMeta();
  const box = $('recentBox'), container = $('recentList');
  if(!list.length){ box.style.display = 'none'; return; }
  box.style.display = 'block';

  // Sort: pinned first (descending), then updatedAt (descending)
  list.sort((a, b) => {
    if (!!b.pinned !== !!a.pinned) return (b.pinned ? 1 : 0) - (a.pinned ? 1 : 0);
    return (b.updatedAt || 0) - (a.updatedAt || 0);
  });

  const query = (filterText || '').trim().toLowerCase();
  const filtered = query ? list.filter(item => item.name.toLowerCase().includes(query)) : list;

  container.innerHTML = '';
  if (!filtered.length) {
    container.innerHTML = '<div style="padding:16px;text-align:center;color:var(--muted-soft);font-size:12.5px">일치하는 최근 문서가 없습니다</div>';
    return;
  }

  filtered.slice(0, 12).forEach(item => {
    const el = document.createElement('div');
    el.className = 'recent-item' + (item.pinned ? ' pinned' : '');
    el.innerHTML = `
      <div class="recent-icon">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><path d="M14 2v6h6"/></svg>
      </div>
      <div class="recent-info">
        <div class="ri-name">${escapeHtml(item.name.replace(/\.pdf$/i,''))}</div>
        <div class="ri-meta">
          <span>${item.page} / ${item.totalPages}쪽</span>
          <span>•</span>
          <span>${formatDate(item.updatedAt)}</span>
        </div>
      </div>
      <button class="recent-pin ${item.pinned ? 'pinned' : ''}" aria-label="고정" title="${item.pinned ? '상단 고정 해제' : '상단 고정'}">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="${item.pinned ? 'currentColor' : 'none'}" stroke="currentColor" stroke-width="2"><path d="M12 2l3.09 6.26L22 9.27l-5 4.87 1.18 6.88L12 17.77l-6.18 3.25L7 14.14 2 9.27l6.91-1.01L12 2z"/></svg>
      </button>
      <button class="recent-del" aria-label="삭제" title="기록 삭제">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
      </button>
    `;
    
    /* 최근 문서 클릭 시 IndexedDB에서 바이너리를 즉시 읽어 열기 */
    el.onclick = async (e) => {
      if (e.target.closest('.recent-del') || e.target.closest('.recent-pin')) return;
      showLoader('문서 복원 중…');
      const buffer = await idbGetFile(item.key);
      if (!buffer) {
        hideLoader();
        toast('저장된 문서 데이터를 찾을 수 없습니다. 다시 열어주세요.');
        return;
      }
      curName = item.name;
      docKey = item.key;
      loadDoc(new Uint8Array(buffer), item.page, item.rotation, item.filter);
    };

    /* 상단 고정 (Pin) 버튼 */
    const pinBtn = el.querySelector('.recent-pin');
    pinBtn.onclick = async (e) => {
      e.stopPropagation();
      item.pinned = !item.pinned;
      await idbSaveMeta(item);
      const searchBox = $('recentSearchInput');
      renderRecent(searchBox ? searchBox.value : '');
      toast(item.pinned ? '상단에 고정되었습니다' : '고정이 해제되었습니다');
    };
    
    /* 개별 삭제 버튼 */
    const delBtn = el.querySelector('.recent-del');
    delBtn.onclick = async (e) => {
      e.stopPropagation();
      await idbDelete(item.key);
      const searchBox = $('recentSearchInput');
      renderRecent(searchBox ? searchBox.value : '');
      toast('기록에서 삭제되었습니다');
    };
    
    container.appendChild(el);
  });
}

const rSearch = $('recentSearchInput');
if (rSearch) {
  rSearch.addEventListener('input', e => {
    const val = e.target.value;
    const clr = $('clearRecentSearch');
    if (clr) clr.style.display = val ? 'inline-block' : 'none';
    renderRecent(val);
  });
}
const clrRSearch = $('clearRecentSearch');
if (clrRSearch) {
  clrRSearch.onclick = () => {
    if (rSearch) rSearch.value = '';
    clrRSearch.style.display = 'none';
    renderRecent('');
  };
}

$('clearRecentsBtn').onclick = async () => {
  if (!confirm('최근 본 문서 기록을 모두 지우시겠습니까?')) return;
  await idbClearAll();
  renderRecent();
  toast('모든 기록을 삭제했습니다');
};

function formatDate(ts){
  if(!ts) return '';
  const d = new Date(ts);
  const now = new Date();
  if (d.toDateString() === now.toDateString()) {
    return d.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
  }
  return `${d.getMonth()+1}/${d.getDate()}`;
}
function escapeHtml(s){ return s.replace(/[&<>"]/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }
renderRecent();

/* ── 로더 / 토스트 ── */
function showLoader(m){ loadMsg.textContent=m||'불러오는 중…'; loader.classList.add('on'); }
function hideLoader(){ loader.classList.remove('on'); }
let toastTimer=null;
function toast(m){
  toastEl.textContent = m;
  toastEl.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(()=> toastEl.classList.remove('show'), 2000);
}

let resizeT = null;
window.addEventListener('resize', ()=>{
  if(!pdfDoc || !viewer.classList.contains('on')) return;
  clearTimeout(resizeT);
  resizeT = setTimeout(()=> renderPage(pageNum, false), 180);
});

/* ── PWA 설치 프롬프트 및 서비스 워커 등록 ── */
let deferredPrompt = null;
window.addEventListener('beforeinstallprompt', e => {
  e.preventDefault();
  deferredPrompt = e;
  const btn = $('installBtn');
  if (btn) btn.style.display = 'inline-flex';
});

if ($('installBtn')) {
  $('installBtn').onclick = async () => {
    if (!deferredPrompt) {
      toast('브라우저 메뉴(⋮)에서 [앱 설치]를 선택해 주세요');
      return;
    }
    deferredPrompt.prompt();
    const { outcome } = await deferredPrompt.userChoice;
    if (outcome === 'accepted') {
      toast('앱 설치가 시작되었습니다');
      $('installBtn').style.display = 'none';
    }
    deferredPrompt = null;
  };
}

window.addEventListener('appinstalled', () => {
  toast('앱 설치가 완료되었습니다!');
  const btn = $('installBtn');
  if (btn) btn.style.display = 'none';
});

if('serviceWorker' in navigator && location.protocol.startsWith('http')){
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('sw.js?v=4').then(reg => {
      reg.update();
    }).catch(err => console.warn('SW register error:', err));
  });
}

/* ── 네이티브 앱 연동 브리지 (Android Intent & File Handler) ── */
window.openIncomingFromNative = async function(fileName) {
  try {
    showLoader('PDF 불러오는 중…');
    curName = fileName || '외부문서.pdf';

    let buffer = null;
    // 1순위: 네이티브 브리지에서 직접 Base64 데이터 수신 (서비스 워커/네트워크 간섭 방지)
    if (window.AndroidBridge && window.AndroidBridge.getIncomingPdfBase64) {
      try {
        const b64 = window.AndroidBridge.getIncomingPdfBase64();
        if (b64 && b64.length > 0) {
          const binStr = atob(b64);
          const len = binStr.length;
          const bytes = new Uint8Array(len);
          for (let i = 0; i < len; i++) {
            bytes[i] = binStr.charCodeAt(i);
          }
          buffer = bytes.buffer;
        }
      } catch(e) {
        console.warn('Bridge base64 fallback to fetch:', e);
      }
    }

    // 2순위: 가상 스트림 URL fetch
    if (!buffer) {
      const res = await fetch('./incoming.pdf?t=' + Date.now());
      if (!res.ok) throw new Error('HTTP ' + res.status);
      buffer = await res.arrayBuffer();
    }

    docKey = 'pdf::' + curName + '::' + buffer.byteLength;
    await idbSaveFile(docKey, buffer);
    await loadDoc(new Uint8Array(buffer), 1, 0, 'filter-default');
    if (window.AndroidBridge && window.AndroidBridge.onPdfLoaded) {
      window.AndroidBridge.onPdfLoaded();
    }
  } catch(err) {
    console.error('Failed to open incoming PDF:', err);
    hideLoader();
    toast('외부 PDF 열기 실패: ' + err.message);
  }
};

window.handleBackPressed = function() {
  if (pwdModal && pwdModal.classList.contains('on')) {
    pwdModal.classList.remove('on');
    return 'Y';
  }
  if (tocDrawer && tocDrawer.classList.contains('open')) {
    closeTocDrawer();
    return 'Y';
  }
  if (searchBar && !searchBar.classList.contains('hide')) {
    toggleSearchBar(false);
    return 'Y';
  }
  if (viewer && viewer.classList.contains('on')) {
    $('homeBtn').click();
    return 'Y';
  }
  return 'N';
};

function initNativeBridge() {
  if (window.AndroidBridge) {
    const btn = $('installBtn');
    if (btn) btn.style.display = 'none';
    const verBadge = $('appVersionBadge');
    if (verBadge && window.AndroidBridge.getAppVersion) {
      $('versionText').textContent = 'DJS PDF v' + window.AndroidBridge.getAppVersion();
    }
    
    // 네이티브에서 전달된 PDF가 있는지 지속 확인 (백그라운드 스트림 수신 대기)
    const checkIncoming = () => {
      if (window.AndroidBridge.hasIncomingPdf && window.AndroidBridge.hasIncomingPdf()) {
        const name = window.AndroidBridge.getIncomingPdfName();
        window.openIncomingFromNative(name);
        return true;
      }
      return false;
    };

    if (!checkIncoming()) {
      let retries = 25;
      const pollTimer = setInterval(() => {
        if (checkIncoming() || --retries <= 0) {
          clearInterval(pollTimer);
        }
      }, 150);
    }
  }
}

if ($('appVersionBadge')) {
  $('appVersionBadge').onclick = () => {
    if (window.AndroidBridge && window.AndroidBridge.checkUpdate) {
      window.AndroidBridge.checkUpdate();
    } else {
      toast('최신 버전(v1.1.0)입니다');
    }
  };
}

window.addEventListener('DOMContentLoaded', initNativeBridge);
window.addEventListener('load', initNativeBridge);
</script>
