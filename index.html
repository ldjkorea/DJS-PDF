<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#161513">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="PDF 리더">
<link rel="manifest" href="manifest.json?v=5">
<link rel="icon" type="image/png" href="favicon.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; worker-src 'self' blob:; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data: blob:; connect-src 'self'; object-src 'none'; frame-src 'none'; base-uri 'none'; form-action 'none'">
<title>PDF 리더</title>
<style>
  :root{
    --chrome: #161513;
    --canvas-bg: #1f1d1a;
    --bar: rgba(22, 21, 19, 0.92);
    --card-bg: rgba(34, 31, 28, 0.88);
    --accent: #d4a747;
    --accent-dim: #9c7a2f;
    --accent-glow: rgba(212, 167, 71, 0.24);
    --text: #f0ebe1;
    --muted: #948c7e;
    --muted-soft: #6e675c;
    --btn: rgba(255, 255, 255, 0.08);
    --btn-hover: rgba(255, 255, 255, 0.12);
    --btn-active: rgba(212, 167, 71, 0.22);
    --line: rgba(255, 255, 255, 0.08);
    --line-strong: rgba(212, 167, 71, 0.35);
  }
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{height:100%;overflow:hidden}
  body{
    font-family:"Pretendard Variable", Pretendard, -apple-system, BlinkMacSystemFont, system-ui, Roboto, "Noto Sans KR", sans-serif;
    background:var(--chrome);color:var(--text);
    overscroll-behavior:none;
    letter-spacing:-0.015em;
  }

  /* ── 시작 화면 (Welcome) ── */
  #welcome{
    position:fixed;inset:0;z-index:30;
    display:flex;flex-direction:column;align-items:center;justify-content:flex-start;
    text-align:center;padding:calc(env(safe-area-inset-top) + 36px) 20px calc(env(safe-area-inset-bottom) + 24px);
    background:radial-gradient(130% 90% at 50% -10%, #29241e 0%, var(--chrome) 70%);
    overflow-y:auto;-webkit-overflow-scrolling:touch;
  }
  .brand-wrap{
    display:flex;flex-direction:column;align-items:center;margin-bottom:28px;
  }
  .brand-logo{
    width:84px;height:84px;border-radius:22px;margin-bottom:18px;
    box-shadow:0 16px 36px rgba(0,0,0,0.55), 0 0 24px var(--accent-glow);
    border:1px solid rgba(255,255,255,0.12);
    transition:transform .2s ease;
  }
  .brand-logo:hover{transform:scale(1.03)}
  h1{
    font-size:26px;font-weight:700;letter-spacing:-0.02em;margin-bottom:8px;
    background:linear-gradient(180deg,#fff 20%,#e2dac9 100%);
    -webkit-background-clip:text;-webkit-text-fill-color:transparent;
  }
  .sub{color:var(--muted);font-size:14px;line-height:1.55;max-width:320px;margin-bottom:24px}
  .open-main{
    display:inline-flex;align-items:center;gap:10px;
    border:none;cursor:pointer;font-size:15.5px;font-weight:600;color:#181613;
    background:linear-gradient(180deg, #dfb350, #b88d33);
    padding:14px 34px;border-radius:14px;
    box-shadow:0 10px 28px rgba(212,167,71,0.28), inset 0 1px 1px rgba(255,255,255,0.3);
    transition:transform .15s, box-shadow .15s;
  }
  .open-main:active{transform:scale(.96);box-shadow:0 4px 12px rgba(212,167,71,0.2)}
  .drop-hint{
    margin-top:12px;font-size:12.5px;color:var(--muted-soft);
    display:flex;align-items:center;gap:6px;
  }

  /* ── 최근 본 문서 목록 ── */
  .recent{
    margin-top:32px;width:100%;max-width:440px;
  }
  .recent-head{
    display:flex;align-items:center;justify-content:space-between;
    margin-bottom:10px;padding:0 4px;
  }
  .recent-head .rtitle{font-size:12px;font-weight:600;letter-spacing:1px;text-transform:uppercase;color:var(--muted)}
  .recent-head .clear-btn{
    background:none;border:none;color:var(--muted-soft);font-size:11.5px;cursor:pointer;
    padding:2px 6px;border-radius:6px;transition:color .15s;
  }
  .recent-head .clear-btn:hover{color:var(--text)}
  .recent-list{display:flex;flex-direction:column;gap:8px}
  .recent-item{
    display:flex;align-items:center;gap:12px;width:100%;
    background:var(--card-bg);border:1px solid var(--line);border-radius:12px;
    padding:12px 14px;cursor:pointer;color:var(--text);
    text-align:left;transition:background .15s, border-color .15s, transform .1s;
    backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);
  }
  .recent-item:hover{background:rgba(44, 40, 35, 0.95);border-color:rgba(212,167,71,0.25)}
  .recent-item:active{transform:scale(.99)}
  .recent-icon{
    width:32px;height:32px;border-radius:8px;background:rgba(212,167,71,0.12);
    display:flex;align-items:center;justify-content:center;color:var(--accent);flex-shrink:0;
  }
  .recent-info{flex:1;min-width:0}
  .recent-info .ri-name{
    font-size:14px;font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;margin-bottom:2px;
  }
  .recent-info .ri-meta{
    font-size:12px;color:var(--muted);display:flex;align-items:center;gap:8px;font-variant-numeric:tabular-nums;
  }
  .recent-del{
    width:28px;height:28px;border:none;border-radius:8px;background:transparent;
    color:var(--muted-soft);cursor:pointer;display:flex;align-items:center;justify-content:center;
    transition:background .12s, color .12s;flex-shrink:0;
  }
  .recent-del:hover{background:rgba(255,255,255,0.1);color:#ff6b6b}

  /* ── 뷰어 (Viewer) ── */
  #viewer{position:fixed;inset:0;background:var(--canvas-bg);overflow:auto;display:none;-webkit-overflow-scrolling:touch}
  #viewer.on{display:block}
  #stage{min-height:100%;display:flex;align-items:center;justify-content:center;padding:56px 12px 84px}
  #canvasWrap{
    position:relative;transform-origin:center center;will-change:transform;
    transition:transform .04s linear;box-shadow:0 14px 44px rgba(0,0,0,0.6);
    border-radius:3px;overflow:hidden;
  }
  #canvasWrap.flip{transition:transform .22s ease, opacity .22s ease}
  #pdfCanvas{display:block;background:#fff}

  /* ── 텍스트 레이어 (TextLayer - 드래그/선택 지원) ── */
  #textLayer{
    position:absolute;top:0;left:0;right:0;bottom:0;
    overflow:hidden;opacity:0.25;line-height:1.0;
    user-select:text;-webkit-user-select:text;pointer-events:auto;
  }
  #textLayer > span{
    position:absolute;white-space:pre;cursor:text;transform-origin:0% 0%;
  }
  #textLayer ::selection{
    background:rgba(212, 167, 71, 0.45);color:transparent;
  }

  /* ── 본문 읽기 테마 필터 (Reading Filters) ── */
  #canvasWrap.filter-default #pdfCanvas{filter:none;background:#fff}
  #canvasWrap.filter-dark #pdfCanvas{
    filter:invert(0.92) hue-rotate(180deg) contrast(0.95);
    background:#161513;
  }
  #canvasWrap.filter-sepia #pdfCanvas{
    filter:sepia(0.42) contrast(0.96) brightness(0.95);
    background:#f4ecdc;
  }
  #canvasWrap.filter-green #pdfCanvas{
    filter:sepia(0.28) hue-rotate(55deg) brightness(0.97) contrast(0.94);
    background:#e9f0e1;
  }

  /* ── 상단 바 ── */
  #topbar{
    position:fixed;top:0;left:0;right:0;z-index:20;display:flex;align-items:center;gap:6px;
    padding:calc(env(safe-area-inset-top) + 8px) 10px 8px;
    background:linear-gradient(180deg,var(--bar),rgba(22,21,19,0));
    backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);
    transition:transform .25s ease, opacity .25s ease;
  }
  #topbar.hide{transform:translateY(-110%);opacity:0;pointer-events:none}
  .icon-btn{
    width:36px;height:36px;flex-shrink:0;border:none;border-radius:10px;
    background:var(--btn);color:var(--text);cursor:pointer;display:flex;align-items:center;justify-content:center;
    transition:background .15s, transform .1s;border:1px solid var(--line);
  }
  .icon-btn:hover{background:var(--btn-hover)}
  .icon-btn:active{background:var(--btn-active);transform:scale(.94)}
  .icon-btn.active{background:var(--btn-active);color:var(--accent);border-color:var(--line-strong)}
  #fileName{flex:1;font-size:14px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--text);padding:0 4px}

  /* ── 검색 바 (Floating Search Bar) ── */
  .search-bar{
    position:fixed;top:calc(env(safe-area-inset-top) + 54px);left:12px;right:12px;z-index:25;
    background:rgba(26, 24, 21, 0.96);border:1px solid var(--line-strong);border-radius:14px;
    padding:6px 10px;display:flex;align-items:center;gap:8px;
    box-shadow:0 12px 32px rgba(0,0,0,0.65), 0 0 16px var(--accent-glow);
    backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);
    transition:transform .22s ease, opacity .22s ease;
  }
  .search-bar.hide{transform:translateY(-140%);opacity:0;pointer-events:none}
  .sb-input-wrap{flex:1;display:flex;align-items:center;gap:8px;background:rgba(0,0,0,0.28);border-radius:9px;padding:6px 10px;border:1px solid var(--line)}
  .sb-input-wrap svg{color:var(--muted);flex-shrink:0}
  #searchInput{flex:1;background:transparent;border:none;color:var(--text);font-size:14px;outline:none}
  #searchInput::placeholder{color:var(--muted-soft)}
  #searchCount{font-size:11.5px;color:var(--accent);font-weight:600;font-variant-numeric:tabular-nums;white-space:nowrap}
  .sb-btn{width:32px;height:32px;border-radius:8px}

  /* ── 텍스트 검색 하이라이트 ── */
  mark.search-match{
    background:rgba(212, 167, 71, 0.45);color:inherit;border-radius:2px;
  }
  mark.search-match.active{
    background:var(--accent);color:#161513;font-weight:700;box-shadow:0 0 8px rgba(212,167,71,0.8);
  }

  /* ── 하단 페이지 스크러버 슬라이더 ── */
  .scrubber-row{
    position:relative;width:100%;max-width:440px;margin:0 auto 6px;
    display:flex;align-items:center;gap:10px;padding:0 6px;
  }
  .scrub-num{font-size:11px;color:var(--muted);font-variant-numeric:tabular-nums;min-width:20px;text-align:center}
  #pageSlider{
    flex:1;height:5px;-webkit-appearance:none;appearance:none;background:rgba(255,255,255,0.12);
    border-radius:3px;outline:none;cursor:pointer;
  }
  #pageSlider::-webkit-slider-thumb{
    -webkit-appearance:none;appearance:none;width:18px;height:18px;border-radius:50%;
    background:var(--accent);box-shadow:0 0 8px rgba(212,167,71,0.6);border:2px solid #161513;cursor:pointer;
    transition:transform .12s, box-shadow .12s;
  }
  #pageSlider:active::-webkit-slider-thumb{transform:scale(1.2);box-shadow:0 0 14px var(--accent)}
  .scrub-bubble{
    position:absolute;top:-34px;left:50%;transform:translateX(-50%);
    background:rgba(30, 27, 24, 0.96);border:1px solid var(--line-strong);border-radius:14px;
    padding:4px 10px;font-size:12px;font-weight:600;color:var(--accent);
    box-shadow:0 6px 18px rgba(0,0,0,0.6);pointer-events:none;opacity:0;transition:opacity .15s;
    font-variant-numeric:tabular-nums;white-space:nowrap;
  }
  .scrub-bubble.visible{opacity:1}

  /* ── 목차 (TOC) 드로어 ── */
  .drawer-backdrop{
    position:fixed;inset:0;background:rgba(0,0,0,0.6);z-index:40;
    opacity:0;pointer-events:none;transition:opacity .25s ease;
    backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px);
  }
  .drawer-backdrop.open{opacity:1;pointer-events:auto}
  .drawer{
    position:fixed;top:0;left:0;bottom:0;width:min(320px, 84vw);z-index:42;
    background:#1c1a17;border-right:1px solid var(--line);
    display:flex;flex-direction:column;
    transform:translateX(-100%);transition:transform .25s cubic-bezier(0.16, 1, 0.3, 1);
    box-shadow:10px 0 32px rgba(0,0,0,0.5);
  }
  .drawer.open{transform:translateX(0)}
  .drawer-header{
    display:flex;align-items:center;justify-content:space-between;
    padding:calc(env(safe-area-inset-top) + 14px) 16px 14px;
    border-bottom:1px solid var(--line);background:rgba(22,21,19,0.7);
  }
  .drawer-title{display:flex;align-items:center;gap:8px;font-size:15px;font-weight:600;color:var(--text)}
  .drawer-title svg{color:var(--accent)}
  .drawer-body{flex:1;overflow-y:auto;padding:8px 0;-webkit-overflow-scrolling:touch}
  .toc-item{
    display:flex;align-items:center;justify-content:space-between;
    padding:11px 16px;cursor:pointer;color:var(--text);font-size:13.5px;
    border-bottom:1px solid rgba(255,255,255,0.03);transition:background .15s, color .15s;
  }
  .toc-item:hover{background:rgba(255,255,255,0.06);color:var(--accent)}
  .toc-item:active{background:var(--btn-active)}
  .toc-item.level-1{padding-left:28px;font-size:13px;color:var(--muted)}
  .toc-item.level-2{padding-left:42px;font-size:12.5px;color:var(--muted-soft)}
  .toc-text{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex:1}
  .toc-page{font-size:11.5px;color:var(--muted-soft);margin-left:8px;font-variant-numeric:tabular-nums}

  /* ── 목차 드로어 탭 & 설정 푸터 ── */
  .drawer-tabs{display:flex;border-bottom:1px solid var(--line);background:rgba(0,0,0,0.2)}
  .drawer-tab{
    flex:1;padding:12px 8px;border:none;background:transparent;color:var(--muted);
    font-size:13px;font-weight:600;cursor:pointer;border-bottom:2px solid transparent;
    transition:color .15s, border-color .15s;
  }
  .drawer-tab:hover{color:var(--text)}
  .drawer-tab.active{color:var(--accent);border-bottom-color:var(--accent)}
  .drawer-footer{
    padding:12px 16px calc(env(safe-area-inset-bottom) + 12px);
    border-top:1px solid var(--line);background:rgba(22,21,19,0.7);
  }
  .setting-row{display:flex;align-items:center;justify-content:space-between;gap:8px}
  .setting-label{font-size:13px;color:var(--text);font-weight:500}
  .toggle-pill{
    padding:4px 12px;border-radius:14px;border:1px solid var(--line);
    background:var(--btn);color:var(--muted);font-size:11.5px;font-weight:700;
    cursor:pointer;transition:all .15s;
  }
  .toggle-pill.active{background:var(--accent);color:#161513;border-color:var(--accent)}

  /* ── 사용자 책갈피 항목 ── */
  .bookmark-item{
    display:flex;align-items:center;justify-content:space-between;
    padding:12px 16px;cursor:pointer;color:var(--text);font-size:13.5px;
    border-bottom:1px solid rgba(255,255,255,0.03);transition:background .15s;
  }
  .bookmark-item:hover{background:rgba(255,255,255,0.06);color:var(--accent)}
  .bookmark-del{
    width:26px;height:26px;border:none;border-radius:6px;background:transparent;
    color:var(--muted-soft);cursor:pointer;display:flex;align-items:center;justify-content:center;
    transition:color .12s;
  }
  .bookmark-del:hover{color:#ff6b6b}

  /* ── 연속 세로 스크롤 (Continuous Scroll) ── */
  #continuousStage{
    width:100%;min-height:100%;display:flex;flex-direction:column;
    align-items:center;padding:56px 12px 96px;gap:14px;box-sizing:border-box;
  }
  .scroll-page-wrap{
    position:relative;background:#fff;box-shadow:0 12px 36px rgba(0,0,0,0.55);
    border-radius:3px;overflow:hidden;transform-origin:center center;
    transition:transform .05s linear;
  }
  .scroll-page-wrap.filter-default canvas{filter:none;background:#fff}
  .scroll-page-wrap.filter-dark canvas{filter:invert(0.92) hue-rotate(180deg) contrast(0.95);background:#161513}
  .scroll-page-wrap.filter-sepia canvas{filter:sepia(0.42) contrast(0.96) brightness(0.95);background:#f4ecdc}
  .scroll-page-wrap.filter-green canvas{filter:sepia(0.28) hue-rotate(55deg) brightness(0.97) contrast(0.94);background:#e9f0e1}
  .scroll-page-num{
    position:absolute;bottom:6px;right:8px;background:rgba(0,0,0,0.65);
    color:var(--accent);font-size:10px;font-weight:700;padding:2px 6px;
    border-radius:4px;pointer-events:none;z-index:5;font-variant-numeric:tabular-nums;
  }
  .scroll-placeholder{
    display:flex;align-items:center;justify-content:center;
    width:100%;height:100%;background:rgba(255,255,255,0.03);color:var(--muted-soft);
    font-size:13px;
  }
  #bookmarkBtn.active svg{fill:var(--accent);stroke:var(--accent)}
  #viewModeBtn.active{background:var(--btn-active);color:var(--accent);border-color:var(--line-strong)}

  /* ── 최근 본 문서 검색 & 핀 ── */
  .recent-search-row{
    display:flex;align-items:center;gap:8px;background:var(--card-bg);
    border:1px solid var(--line);border-radius:10px;padding:8px 12px;margin-bottom:10px;
  }
  .recent-search-row svg{color:var(--muted-soft);flex-shrink:0}
  #recentSearchInput{flex:1;background:transparent;border:none;outline:none;color:var(--text);font-size:13px}
  #recentSearchInput::placeholder{color:var(--muted-soft)}
  .recent-pin{
    width:28px;height:28px;border:none;border-radius:8px;background:transparent;
    color:var(--muted-soft);cursor:pointer;display:flex;align-items:center;justify-content:center;
    transition:background .12s, color .12s, transform .1s;flex-shrink:0;
  }
  .recent-pin:hover{background:rgba(255,255,255,0.08);color:var(--accent)}
  .recent-pin.pinned{color:var(--accent)}

  /* ── 하단 바 ── */
  #bottombar{
    position:fixed;bottom:0;left:0;right:0;z-index:20;
    background:linear-gradient(0deg,var(--bar),rgba(22,21,19,0));
    backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);
    padding:8px 12px calc(env(safe-area-inset-bottom) + 10px);
    transition:transform .25s ease, opacity .25s ease;
  }
  #bottombar.hide{transform:translateY(110%);opacity:0;pointer-events:none}
  .row{display:flex;align-items:center;justify-content:center;gap:8px}
  .row + .row{margin-top:8px}
  .pagebox{
    display:flex;align-items:center;gap:7px;background:var(--btn);
    border:1px solid var(--line);border-radius:11px;padding:5px 8px;
  }
  #pageInput{
    width:48px;text-align:center;font-size:14.5px;font-weight:600;background:transparent;
    border:none;color:var(--accent);-moz-appearance:textfield;font-variant-numeric:tabular-nums;
  }
  #pageInput::-webkit-outer-spin-button,#pageInput::-webkit-inner-spin-button{-webkit-appearance:none}
  .pagebox .slash{color:var(--muted);font-size:13px}
  #pageTotal{font-size:13.5px;color:var(--muted);min-width:18px;text-align:center;font-variant-numeric:tabular-nums}
  .zoombox{
    display:flex;align-items:center;gap:4px;background:var(--btn);
    border:1px solid var(--line);border-radius:11px;padding:4px;
  }
  .z-btn{
    width:34px;height:32px;border:none;border-radius:8px;background:transparent;
    color:var(--text);font-size:17px;cursor:pointer;display:flex;align-items:center;justify-content:center;
    transition:background .12s;
  }
  .z-btn:hover{background:var(--btn-hover)}
  .z-btn:active{background:var(--btn-active)}
  #zoomPct{font-size:12.5px;color:var(--muted);min-width:44px;text-align:center;font-variant-numeric:tabular-nums;font-weight:500}
  .nav-btn{
    width:46px;height:40px;border:none;border-radius:11px;background:var(--btn);
    border:1px solid var(--line);color:var(--text);cursor:pointer;display:flex;
    align-items:center;justify-content:center;transition:background .12s, transform .1s;
  }
  .nav-btn:hover{background:var(--btn-hover)}
  .nav-btn:active{background:var(--btn-active);transform:scale(.94)}
  .nav-btn:disabled{opacity:.3;pointer-events:none}
  .fit-btn{
    height:40px;padding:0 13px;border:none;border-radius:11px;background:var(--btn);
    border:1px solid var(--line);color:var(--text);font-size:13px;font-weight:500;
    cursor:pointer;display:flex;align-items:center;gap:6px;transition:background .12s;white-space:nowrap;
  }
  .fit-btn:hover{background:var(--btn-hover)}
  .fit-btn:active{background:var(--btn-active)}
  .fit-btn.active{background:var(--btn-active);color:var(--accent);border-color:var(--line-strong)}

  /* ── 드래그 앤 드롭 오버레이 ── */
  #dropOverlay{
    position:fixed;inset:0;z-index:60;display:none;align-items:center;justify-content:center;
    background:rgba(22, 21, 19, 0.88);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);
    border:3px dashed var(--accent);pointer-events:none;
  }
  #dropOverlay.active{display:flex}
  .drop-box{
    display:flex;flex-direction:column;align-items:center;gap:12px;color:var(--accent);
  }
  .drop-box span{font-size:18px;font-weight:600;color:var(--text)}

  /* ── 암호 모달 (Password Modal) ── */
  #pwdModal{
    position:fixed;inset:0;z-index:70;display:none;align-items:center;justify-content:center;
    background:rgba(0,0,0,0.65);backdrop-filter:blur(5px);-webkit-backdrop-filter:blur(5px);padding:20px;
  }
  #pwdModal.on{display:flex}
  .pwd-card{
    background:#221f1c;border:1px solid var(--line);border-radius:18px;padding:24px 22px;
    width:100%;max-width:340px;text-align:center;box-shadow:0 20px 48px rgba(0,0,0,0.6);
  }
  .pwd-card h3{font-size:17px;font-weight:600;margin-bottom:8px}
  .pwd-card p{font-size:13px;color:var(--muted);margin-bottom:16px;line-height:1.4}
  #pwdInput{
    width:100%;background:rgba(0,0,0,0.3);border:1px solid var(--line);border-radius:10px;
    padding:11px 13px;font-size:15px;color:var(--text);margin-bottom:14px;outline:none;
  }
  #pwdInput:focus{border-color:var(--accent)}
  .pwd-actions{display:flex;gap:8px}
  .pwd-btn{
    flex:1;padding:11px;border-radius:10px;font-size:14px;font-weight:600;cursor:pointer;border:none;
  }
  .pwd-cancel{background:var(--btn);color:var(--text)}
  .pwd-submit{background:var(--accent);color:#181613}

  /* ── 로딩 / 토스트 ── */
  #loader{
    position:fixed;inset:0;z-index:80;display:none;flex-direction:column;
    align-items:center;justify-content:center;gap:16px;
    background:rgba(22,21,19,.88);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);
  }
  #loader.on{display:flex}
  .spinner{
    width:40px;height:40px;border:3px solid var(--line);border-top-color:var(--accent);
    border-radius:50%;animation:spin .8s linear infinite;
  }
  @keyframes spin{to{transform:rotate(360deg)}}
  #loadMsg{font-size:13.5px;color:var(--muted);font-weight:500}
  .toast{
    position:fixed;left:50%;bottom:92px;transform:translateX(-50%);
    background:rgba(36,33,29,.96);border:1px solid var(--line-strong);color:var(--text);
    font-size:13px;padding:9px 18px;border-radius:22px;z-index:90;
    box-shadow:0 10px 28px rgba(0,0,0,.5);opacity:0;transition:opacity .25s, transform .25s;
    pointer-events:none;font-weight:500;
  }
  .toast.show{opacity:1;transform:translateX(-50%) translateY(-4px)}
  svg{display:block}

  /* Narrow screens keep every action available without clipping the document name. */
  #topbar{flex-wrap:wrap;background:var(--bar)}
  #fileName{min-width:80px}
  .row{flex-wrap:wrap}
  #stage{padding-top:var(--reader-top,110px);padding-bottom:var(--reader-bottom,120px)}
  #continuousStage{padding-top:var(--reader-top,110px);padding-bottom:var(--reader-bottom,120px)}
  #viewer{scroll-padding-top:var(--reader-top,110px);scroll-padding-bottom:var(--reader-bottom,120px)}
  #canvasWrap{flex-shrink:0}
  #textLayer,.textLayer{color:transparent;opacity:1}
  .search-bar{top:var(--reader-top,110px)}
  .sb-input-wrap{min-width:0}
  #searchInput{min-width:0;width:100%}
  .nav-btn{flex-shrink:0}
  @media(max-width:600px){
    #fileName{flex-basis:calc(100% - 100px);min-width:0}
    #topbar{gap:6px;justify-content:flex-end}
    #topbar .icon-btn{width:38px;height:38px}
    #topbar #homeBtn,#topbar #tocBtn{margin-right:0}
    #bottombar{padding-left:6px;padding-right:6px}
    #bottombar>.row{gap:6px}
    .nav-btn{width:38px}
    .pagebox{gap:4px;padding:5px}
    #pageInput{width:38px}
    .zoombox{gap:0;padding:2px}
    .z-btn{width:30px}
    #zoomPct{min-width:38px}
  }
</style>
</head>
<body>

<!-- ── 시작 화면 ── -->
<div id="welcome">
  <div class="brand-wrap">
    <img src="icon-192.png" alt="PDF 리더" class="brand-logo" width="84" height="84">
    <h1>PDF 리더</h1>
    <p class="sub">광고 없는 초경량 고화질 PDF 뷰어<br>오프라인 완전 저장 · 야간 독서 모드</p>
    <div style="display:flex;gap:10px;justify-content:center;flex-wrap:wrap">
      <button class="open-main" id="openMain">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><path d="M14 2v6h6"/><path d="M12 18v-6"/><path d="M9 15l3-3 3 3"/></svg>
        <span>PDF 파일 열기</span>
      </button>
      <button class="open-main" id="installBtn" style="display:none;background:linear-gradient(180deg,#35312b,#23201b);color:var(--text);border:1px solid var(--line-strong);box-shadow:0 8px 20px rgba(0,0,0,0.4)">
        <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
        <span>앱 설치</span>
      </button>
    </div>
    <div class="drop-hint">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" y1="3" x2="12" y2="15"/></svg>
      <span>또는 화면에 파일을 끌어다 놓으세요</span>
    </div>
    <div id="appVersionBadge" style="margin-top:14px;font-size:12px;color:var(--muted-soft);cursor:pointer;display:inline-flex;align-items:center;gap:6px;padding:4px 10px;border-radius:20px;background:rgba(255,255,255,0.03);border:1px solid rgba(255,255,255,0.06);transition:background .2s;" title="업데이트 확인">
      <span style="display:inline-block;width:6px;height:6px;border-radius:50%;background:var(--accent)"></span>
      <span id="versionText">DJS PDF v1.2.1</span>
    </div>
  </div>

  <div class="recent" id="recentBox" style="display:none">
    <div class="recent-head">
      <div class="rtitle">최근 본 문서</div>
      <button class="clear-btn" id="clearRecentsBtn">기록 지우기</button>
    </div>
    <div class="recent-search-row">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
      <input type="text" id="recentSearchInput" placeholder="최근 문서 제목 검색…">
      <button id="clearRecentSearch" style="display:none;background:none;border:none;color:var(--muted);font-size:12px;cursor:pointer">✕</button>
    </div>
    <div class="recent-list" id="recentList"></div>
  </div>
</div>

<!-- ── 뷰어 본체 ── -->
<div id="viewer">
  <!-- 단면 보기 모드 -->
  <div id="stage">
    <div id="canvasWrap" class="filter-default">
      <canvas id="pdfCanvas"></canvas>
      <div id="textLayer"></div>
    </div>
  </div>
  <!-- 연속 세로 스크롤 모드 -->
  <div id="continuousStage" style="display:none"></div>
</div>

<!-- ── 목차 & 책갈피 드로어 & 백드롭 ── -->
<div id="tocBackdrop" class="drawer-backdrop"></div>
<div id="tocDrawer" class="drawer">
  <div class="drawer-header">
    <div class="drawer-title">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="8" y1="6" x2="21" y2="6"/><line x1="8" y1="12" x2="21" y2="12"/><line x1="8" y1="18" x2="21" y2="18"/><line x1="3" y1="6" x2="3.01" y2="6"/><line x1="3" y1="12" x2="3.01" y2="12"/><line x1="3" y1="18" x2="3.01" y2="18"/></svg>
      <span>목차 & 책갈피</span>
    </div>
    <button class="icon-btn" id="closeTocBtn" aria-label="목차 닫기">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
    </button>
  </div>
  <div class="drawer-tabs">
    <button class="drawer-tab active" id="tabToc">문서 목차</button>
    <button class="drawer-tab" id="tabBookmarks">책갈피 (<span id="bookmarkCount">0</span>)</button>
  </div>
  <div class="drawer-body" id="tocList"></div>
  <div class="drawer-body" id="bookmarkList" style="display:none"></div>
  <div class="drawer-footer">
    <div class="setting-row">
      <span class="setting-label">볼륨키로 페이지 넘김</span>
      <button class="toggle-pill active" id="volNavToggle">ON</button>
    </div>
  </div>
</div>

<!-- ── 상단 툴바 ── -->
<div id="topbar" class="hide">
  <button class="icon-btn" id="homeBtn" aria-label="홈으로" title="홈으로">
    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12l9-9 9 9"/><path d="M5 10v10h14V10"/></svg>
  </button>
  <button class="icon-btn" id="tocBtn" aria-label="목차 및 책갈피" title="목차 & 책갈피 (TOC)">
    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="8" y1="6" x2="21" y2="6"/><line x1="8" y1="12" x2="21" y2="12"/><line x1="8" y1="18" x2="21" y2="18"/><line x1="3" y1="6" x2="3.01" y2="6"/><line x1="3" y1="12" x2="3.01" y2="12"/><line x1="3" y1="18" x2="3.01" y2="18"/></svg>
  </button>
  <div id="fileName">문서</div>
  <button class="icon-btn" id="viewModeBtn" aria-label="보기 모드" title="단면 넘김 / 연속 세로 스크롤 전환">
    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="16" y1="13" x2="8" y2="13"/><line x1="16" y1="17" x2="8" y2="17"/></svg>
  </button>
  <button class="icon-btn" id="bookmarkBtn" aria-label="책갈피" title="현재 페이지 책갈피 추가/삭제">
    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 21l-7-5-7 5V5a2 2 0 0 1 2-2h10a2 2 0 0 1 2 2z"/></svg>
  </button>
  <button class="icon-btn" id="searchBtn" aria-label="검색" title="문서 내 검색 (Ctrl+F)">
    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
  </button>
  <button class="icon-btn" id="filterBtn" aria-label="읽기 테마 모드" title="기본 / 다크 / 세피아 / 눈편한 모드">
    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="5"/><path d="M12 1v2M12 21v2M4.22 4.22l1.42 1.42M18.36 18.36l1.42 1.42M1 12h2M21 12h2M4.22 19.78l1.42-1.42M18.36 5.64l1.42-1.42"/></svg>
  </button>
  <button class="icon-btn" id="shareBtn" aria-label="문서 공유" title="문서 공유">
    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="18" cy="5" r="3"/><circle cx="6" cy="12" r="3"/><circle cx="18" cy="19" r="3"/><line x1="8.59" y1="13.51" x2="15.42" y2="17.49"/><line x1="15.41" y1="6.51" x2="8.59" y2="10.49"/></svg>
  </button>
  <button class="icon-btn" id="rotateBtn" aria-label="90도 회전" title="시계방향 90도 회전">
    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21.5 2v6h-6M21.34 15.57a10 10 0 1 1-.57-8.38l5.67-5.67"/></svg>
  </button>
  <button class="icon-btn" id="openBtn2" aria-label="다른 파일 열기" title="다른 PDF 파일 열기">
    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><path d="M14 2v6h6"/><path d="M12 18v-6"/><path d="M9 15l3-3 3 3"/></svg>
  </button>
</div>

<!-- ── 플로팅 검색 바 ── -->
<div id="searchBar" class="search-bar hide">
  <div class="sb-input-wrap">
    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
    <input type="text" id="searchInput" placeholder="문서 내 검색…" autocomplete="off">
    <span id="searchCount">0 / 0</span>
  </div>
  <button class="icon-btn sb-btn" id="searchPrevBtn" aria-label="이전 찾기" title="이전 결과 (Shift+Enter)">
    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><polyline points="18 15 12 9 6 15"/></svg>
  </button>
  <button class="icon-btn sb-btn" id="searchNextBtn" aria-label="다음 찾기" title="다음 결과 (Enter)">
    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><polyline points="6 9 12 15 18 9"/></svg>
  </button>
  <button class="icon-btn sb-btn" id="searchCloseBtn" aria-label="검색 닫기" title="닫기 (ESC)">
    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
  </button>
</div>

<!-- ── 하단 툴바 ── -->
<div id="bottombar" class="hide">
  <!-- 페이지 스크러버 슬라이더 -->
  <div class="scrubber-row">
    <div class="scrub-bubble" id="scrubBubble">1 / 1 쪽</div>
    <span class="scrub-num" id="scrubMin">1</span>
    <input type="range" id="pageSlider" min="1" max="1" value="1" step="1">
    <span class="scrub-num" id="scrubMax">1</span>
  </div>
  <div class="row">
    <button class="nav-btn" id="prevBtn" aria-label="이전 페이지">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg>
    </button>
    <div class="pagebox">
      <input id="pageInput" type="number" min="1" value="1" inputmode="numeric">
      <span class="slash">/</span>
      <span id="pageTotal">1</span>
    </div>
    <button class="nav-btn" id="nextBtn" aria-label="다음 페이지">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18l6-6-6-6"/></svg>
    </button>
    <div class="zoombox">
      <button class="z-btn" id="zoomOut" aria-label="축소">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M5 12h14"/></svg>
      </button>
      <span id="zoomPct">100%</span>
      <button class="z-btn" id="zoomIn" aria-label="확대">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>
      </button>
    </div>
    <button class="fit-btn" id="fitBtn">
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 8V5a2 2 0 0 0-2-2h-3M3 16v3a2 2 0 0 0 2 2h3M16 21h3a2 2 0 0 0 2-2v-3M8 3H5a2 2 0 0 0-2 2v3"/></svg>
      <span id="fitBtnText">너비 맞춤</span>
    </button>
  </div>
</div>

<!-- ── 드래그 앤 드롭 오버레이 ── -->
<div id="dropOverlay">
  <div class="drop-box">
    <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><path d="M14 2v6h6"/><path d="M12 18v-6"/><path d="M9 15l3-3 3 3"/></svg>
    <span>PDF 파일을 여기에 놓으세요</span>
  </div>
</div>

<!-- ── 비밀번호 입력 모달 ── -->
<div id="pwdModal">
  <div class="pwd-card">
    <div style="width:40px;height:40px;border-radius:10px;background:rgba(212,167,71,0.15);display:flex;align-items:center;justify-content:center;color:var(--accent);margin:0 auto 12px">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
    </div>
    <h3>비밀번호 보호 문서</h3>
    <p id="pwdMsg">이 문서는 암호화되어 있습니다. 열람하려면 비밀번호를 입력해 주세요.</p>
    <input type="password" id="pwdInput" placeholder="비밀번호 입력" autocomplete="current-password">
    <div class="pwd-actions">
      <button class="pwd-btn pwd-cancel" id="pwdCancelBtn">취소</button>
      <button class="pwd-btn pwd-submit" id="pwdSubmitBtn">열기</button>
    </div>
  </div>
</div>

<!-- ── 로딩 / 토스트 / 파일 선택기 ── -->
<div id="loader"><div class="spinner"></div><div id="loadMsg">불러오는 중…</div></div>
<div class="toast" id="toast"></div>
<input type="file" id="fileInput" accept="application/pdf,.pdf" style="display:none">

<script src="pdf.min.js"></script>
<script src="reader-core.js"></script>
<script src="reader-store.js"></script>
<script src="app.js"></script>
</body>
</html>
